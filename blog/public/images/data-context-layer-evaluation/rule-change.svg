<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">Purchasing customers change from three to two after adding a 50 dollar per-order threshold</title><g font-family="Inter, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f7f2" stroke="none"/><text x="45" y="48" font-size="18" fill="#7455dc" font-weight="650" text-anchor="start">ONE RULE CHANGE. AN EXPLAINABLE DIFFERENCE.</text><text x="45" y="94" font-size="34" fill="#202520" font-weight="650" text-anchor="start">Keep the data fixed. Compare who qualifies.</text><rect x="45" y="132" width="509" height="324" rx="18" fill="#fff" stroke="#dddfe0"/><text x="70" y="171" font-size="25" fill="#202520" font-weight="650" text-anchor="start">Original rule</text><text x="70" y="207" font-size="21" fill="#666b66" font-weight="400" text-anchor="start">A completed October order</text><text x="70" y="270" font-size="50" fill="#7455dc" font-weight="650" text-anchor="start">3</text><text x="114" y="270" font-size="22" fill="#202520" font-weight="400" text-anchor="start">purchasing customers</text><g transform="translate(115,330) scale(0.95)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C001</text></g><g transform="translate(245,330) scale(0.95)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C004</text></g><g transform="translate(375,330) scale(0.95)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C005</text></g><text x="70" y="425" font-size="20" fill="#666b66" font-weight="400" text-anchor="start">North: 2   ·   South: 1</text><rect x="646" y="132" width="509" height="324" rx="18" fill="#fff" stroke="#dddfe0"/><text x="671" y="171" font-size="25" fill="#202520" font-weight="650" text-anchor="start">Candidate rule</text><text x="671" y="207" font-size="21" fill="#666b66" font-weight="400" text-anchor="start">A completed October order ≥ $50</text><text x="671" y="270" font-size="50" fill="#7455dc" font-weight="650" text-anchor="start">2</text><text x="715" y="270" font-size="22" fill="#202520" font-weight="400" text-anchor="start">purchasing customers</text><g transform="translate(716,330) scale(0.95)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C001</text></g><g transform="translate(846,330) scale(0.95)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C004</text></g><g transform="translate(976,330) scale(0.95)"><circle cy="-16" r="13" fill="#c9cbc7"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#c9cbc7"/><text x="0" y="55" font-size="17" fill="#c9cbc7" font-weight="600" text-anchor="middle">C005</text></g><text x="976" y="425" font-size="19" fill="#666b66" font-weight="500" text-anchor="middle">$40: excluded</text><path d="M573 285h52m-11-10 11 10-11 10" stroke="#7455dc" stroke-width="3" fill="none"/><rect x="45" y="480" width="1110" height="112" rx="18" fill="#eee8ff" stroke="none"/><text x="70" y="517" font-size="17" fill="#7455dc" font-weight="700" text-anchor="start">WHAT CHANGED?</text><text x="70" y="552" font-size="25" fill="#202520" font-weight="600" text-anchor="start">C005 leaves the group. North: 2 → 1. South stays at 1.</text><text x="45" y="632" font-size="19" fill="#666b66" font-weight="400" text-anchor="start">Same October snapshot · Distinct customer IDs · Threshold per order, not total spend</text><text x="45" y="659" font-size="17" fill="#666b66" font-weight="400" text-anchor="start">Reference SQL exercise — not a claim of automatic historical replay or an authorization test.</text></g></svg>