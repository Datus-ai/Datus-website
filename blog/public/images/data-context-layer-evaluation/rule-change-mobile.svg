<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1020" viewBox="0 0 600 1020" role="img" aria-labelledby="title"><title id="title">Original purchasing rule includes three customers; candidate 50 dollar threshold includes two</title><g font-family="Inter, Arial, sans-serif"><rect x="0" y="0" width="600" height="1020" rx="0" fill="#f7f7f2" stroke="none"/><text x="28" y="40" font-size="18" fill="#7455dc" font-weight="650" text-anchor="start">ONE RULE CHANGE</text><text x="28" y="82" font-size="29" fill="#202520" font-weight="650" text-anchor="start">Same data. Who qualifies?</text><rect x="25" y="114" width="550" height="280" rx="18" fill="#fff" stroke="#dddfe0"/><text x="48" y="154" font-size="26" fill="#202520" font-weight="650" text-anchor="start">Original rule</text><text x="48" y="189" font-size="22" fill="#666b66" font-weight="400" text-anchor="start">A completed October order</text><text x="48" y="241" font-size="28" fill="#7455dc" font-weight="650" text-anchor="start">3 purchasing customers</text><g transform="translate(112,299) scale(0.9)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C001</text></g><g transform="translate(272,299) scale(0.9)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C004</text></g><g transform="translate(432,299) scale(0.9)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C005</text></g><rect x="25" y="464" width="550" height="280" rx="18" fill="#fff" stroke="#dddfe0"/><text x="48" y="504" font-size="26" fill="#202520" font-weight="650" text-anchor="start">Candidate rule</text><text x="48" y="539" font-size="22" fill="#666b66" font-weight="400" text-anchor="start">A completed October order ≥ $50</text><text x="48" y="591" font-size="28" fill="#7455dc" font-weight="650" text-anchor="start">2 purchasing customers</text><g transform="translate(112,649) scale(0.9)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C001</text></g><g transform="translate(272,649) scale(0.9)"><circle cy="-16" r="13" fill="#7455dc"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#7455dc"/><text x="0" y="55" font-size="17" fill="#7455dc" font-weight="600" text-anchor="middle">C004</text></g><g transform="translate(432,649) scale(0.9)"><circle cy="-16" r="13" fill="#c9cbc7"/><path d="M-25 26v-9a25 25 0 0 1 50 0v9z" fill="#c9cbc7"/><text x="0" y="55" font-size="17" fill="#c9cbc7" font-weight="600" text-anchor="middle">C005</text></g><text x="432" y="724" font-size="18" fill="#666b66" font-weight="500" text-anchor="middle">$40: excluded</text><path d="M300 410v37m-10-10 10 10 10-10" stroke="#7455dc" stroke-width="3" fill="none"/><rect x="25" y="773" width="550" height="119" rx="18" fill="#eee8ff" stroke="none"/><text x="48" y="809" font-size="19" fill="#7455dc" font-weight="700" text-anchor="start">C005 LEAVES THE GROUP</text><text x="48" y="853" font-size="25" fill="#202520" font-weight="600" text-anchor="start">North: 2 → 1. South stays at 1.</text><text x="28" y="931" font-size="20" fill="#666b66" font-weight="400" text-anchor="start">Fixed October snapshot · Distinct customers</text><text x="28" y="960" font-size="20" fill="#666b66" font-weight="400" text-anchor="start">Threshold applies to each completed order.</text><text x="28" y="995" font-size="18" fill="#666b66" font-weight="400" text-anchor="start">Reference SQL exercise, not an access-control test.</text></g></svg>