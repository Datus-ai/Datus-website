<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">One net-sales question, three different scopes</title><desc id="desc">A business user asks an agent for net sales. The finance policy yields 230 dollars after refunds, legacy SQL yields 250 dollars before refunds, and the existing model yields 450 dollars including cancelled orders. Clarify the intended definition before answering. Fictional sample values.</desc><rect width="100%" height="100%" fill="#faf9f6" rx="12"/><g font-family="Inter,Arial,sans-serif"><text x="36" y="46" font-size="28" font-weight="700" fill="#292f26">One question. Three possible answers.</text><g fill="none" stroke="#7655c7" stroke-width="2.5"><circle cx="67" cy="105" r="13"/><path d="M44 148v-9a23 23 0 0 1 46 0v9"/></g><rect x="115" y="80" width="582" height="76" rx="16" fill="#eee7fa"/><text x="138" y="111" font-size="16" font-weight="600" fill="#7655c7">Business user → Agent</text><text x="138" y="140" font-size="24" font-weight="650" fill="#292f26">“What are our net sales?”</text><path d="M550 156v38M191 220v-26h718v26M550 194v26" fill="none" stroke="#b8a3d6" stroke-width="2"/><rect x="36" y="220" width="322" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(58 242)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1h22l9 9v35H5zM27 1v10h9M12 20h17M12 27h17M12 34h12"/></g><text x="58" y="318" font-size="22" font-weight="650" fill="#292f26">Finance policy</text><text x="58" y="352" font-size="18" font-weight="400" fill="#292f26">Completed orders</text><text x="58" y="378" font-size="18" font-weight="400" fill="#292f26">less recorded refunds</text><text x="58" y="438" font-size="38" font-weight="650" fill="#7655c7">$230</text><rect x="389" y="220" width="322" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(411 242)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="42" height="36" rx="5"/><path d="m15 13-7 7 7 7m14-14 7 7-7 7m-5-17-5 20"/></g><text x="411" y="318" font-size="22" font-weight="650" fill="#292f26">Legacy dashboard SQL</text><text x="411" y="352" font-size="18" font-weight="400" fill="#292f26">Completed orders</text><text x="411" y="378" font-size="18" font-weight="400" fill="#292f26">before refunds</text><text x="411" y="438" font-size="38" font-weight="650" fill="#7655c7">$250</text><rect x="742" y="220" width="322" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(764 242)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12v11M9 23h26M9 23v8m26-8v8"/><rect x="13" y="1" width="18" height="12" rx="3"/><rect x="1" y="31" width="16" height="12" rx="3"/><rect x="27" y="31" width="16" height="12" rx="3"/></g><text x="764" y="318" font-size="22" font-weight="650" fill="#292f26">Existing semantic model</text><text x="764" y="352" font-size="18" font-weight="400" fill="#292f26">All order amounts</text><text x="764" y="378" font-size="18" font-weight="400" fill="#292f26">including cancelled orders</text><text x="764" y="438" font-size="38" font-weight="650" fill="#7655c7">$450</text><text x="36" y="510" font-size="24" font-weight="650" fill="#292f26">Same records. Different definitions.</text><text x="36" y="547" font-size="21" font-weight="400" fill="#292f26">Clarify the intended scope before choosing a result.</text><text x="36" y="587" font-size="16" font-weight="400" fill="#64695f">Fictional USD example · Neither retrieval nor successful execution determines business authority.</text></g></svg>