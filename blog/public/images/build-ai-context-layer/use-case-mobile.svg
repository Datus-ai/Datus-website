<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1130" viewBox="0 0 420 1130" role="img" aria-labelledby="title desc"><title id="title">One net-sales question, three different scopes</title><desc id="desc">A business user asks an agent for net sales. The finance policy yields 230 dollars after refunds, legacy SQL yields 250 dollars before refunds, and the existing model yields 450 dollars including cancelled orders. Clarify the intended definition before answering. Fictional sample values.</desc><rect width="100%" height="100%" fill="#faf9f6" rx="12"/><g font-family="Inter,Arial,sans-serif"><text x="22" y="40" font-size="27" font-weight="700" fill="#292f26">One question.</text><text x="22" y="74" font-size="27" font-weight="700" fill="#292f26">Three possible answers.</text><rect x="22" y="99" width="376" height="81" rx="12" fill="#eee7fa"/><text x="40" y="127" font-size="16" font-weight="600" fill="#7655c7">Business user → Agent</text><text x="40" y="157" font-size="23" font-weight="650" fill="#292f26">“What are our net sales?”</text><rect x="22" y="205" width="376" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(44 227)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1h22l9 9v35H5zM27 1v10h9M12 20h17M12 27h17M12 34h12"/></g><text x="44" y="303" font-size="22" font-weight="650" fill="#292f26">Finance policy</text><text x="44" y="337" font-size="18" font-weight="400" fill="#292f26">Completed orders</text><text x="44" y="363" font-size="18" font-weight="400" fill="#292f26">less recorded refunds</text><text x="44" y="423" font-size="38" font-weight="650" fill="#7655c7">$230</text><rect x="22" y="471" width="376" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(44 493)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="42" height="36" rx="5"/><path d="m15 13-7 7 7 7m14-14 7 7-7 7m-5-17-5 20"/></g><text x="44" y="569" font-size="22" font-weight="650" fill="#292f26">Legacy dashboard SQL</text><text x="44" y="603" font-size="18" font-weight="400" fill="#292f26">Completed orders</text><text x="44" y="629" font-size="18" font-weight="400" fill="#292f26">before refunds</text><text x="44" y="689" font-size="38" font-weight="650" fill="#7655c7">$250</text><rect x="22" y="737" width="376" height="244" rx="12" fill="white" stroke="#ded6e9"/><g transform="translate(44 759)" fill="none" stroke="#7655c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12v11M9 23h26M9 23v8m26-8v8"/><rect x="13" y="1" width="18" height="12" rx="3"/><rect x="1" y="31" width="16" height="12" rx="3"/><rect x="27" y="31" width="16" height="12" rx="3"/></g><text x="44" y="835" font-size="22" font-weight="650" fill="#292f26">Existing semantic model</text><text x="44" y="869" font-size="18" font-weight="400" fill="#292f26">All order amounts</text><text x="44" y="895" font-size="18" font-weight="400" fill="#292f26">including cancelled orders</text><text x="44" y="955" font-size="38" font-weight="650" fill="#7655c7">$450</text><text x="22" y="1036" font-size="23" font-weight="650" fill="#292f26">Clarify scope before answering.</text><text x="22" y="1073" font-size="19" font-weight="400" fill="#292f26">Same records. Different definitions.</text><text x="22" y="1107" font-size="16" font-weight="400" fill="#64695f">Fictional values in USD.</text></g></svg>