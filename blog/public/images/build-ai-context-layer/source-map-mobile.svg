<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1060" viewBox="0 0 420 1060" role="img" aria-labelledby="t"><title id="t">Source evidence is compared before a metric is chosen</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c6cbf"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292f26"><text x="22" y="40" font-size="24" font-weight="700">Sources inform. Review decides.</text><rect x="22" y="80" width="376" height="135" rx="10" fill="white" stroke="#cdbde4"/><text x="42" y="114" font-size="21" font-weight="700">Existing SQL</text><text x="42" y="152" font-size="17">Observed logic, filters and joins</text><rect x="22" y="245" width="376" height="135" rx="10" fill="white" stroke="#cdbde4"/><text x="42" y="279" font-size="21" font-weight="700">Business document</text><text x="42" y="317" font-size="17">Intended meaning and exceptions</text><rect x="22" y="410" width="376" height="135" rx="10" fill="white" stroke="#cdbde4"/><text x="42" y="444" font-size="21" font-weight="700">Existing model</text><text x="42" y="482" font-size="17">Current definition and execution</text><path d="M210 545V589" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="605" width="376" height="180" rx="10" fill="#eee7fa" stroke="#cdbde4"/><text x="42" y="639" font-size="21" font-weight="700">Compare and review</text><text x="42" y="677" font-size="17">Confirm scope and authority</text><text x="42" y="706" font-size="17">Keep unresolved questions</text><text x="42" y="735" font-size="17">Do not choose by popularity</text><path d="M210 785V826" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="843" width="376" height="174" rx="10" fill="#f0edf5" stroke="#cdbde4"/><text x="42" y="877" font-size="21" font-weight="700">Context ready for reuse</text><text x="42" y="915" font-size="17">Source evidence + selected metric</text><text x="42" y="944" font-size="17">Executable checks</text><text x="42" y="973" font-size="17">Consumer scope remains explicit</text></g></svg>