<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t"><title id="t">SQL, documents and models contribute different evidence before review and reuse</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c6cbf"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292f26"><text x="35" y="47" font-size="28" font-weight="700">Three sources. Different evidence.</text><rect x="35" y="95" width="310" height="188" rx="10" fill="white" stroke="#cdbde4"/><text x="55" y="129" font-size="21" font-weight="700">Existing SQL</text><text x="55" y="167" font-size="17">Observed report logic</text><text x="55" y="196" font-size="17">Filters and joins</text><text x="55" y="225" font-size="17">Question-specific scope</text><path d="M190 283V315H550V347" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="395" y="95" width="310" height="188" rx="10" fill="white" stroke="#cdbde4"/><text x="415" y="129" font-size="21" font-weight="700">Business document</text><text x="415" y="167" font-size="17">Intended business meaning</text><text x="415" y="196" font-size="17">Exceptions and rationale</text><text x="415" y="225" font-size="17">Owner / status to confirm</text><path d="M550 283V315H550V347" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="755" y="95" width="310" height="188" rx="10" fill="white" stroke="#cdbde4"/><text x="775" y="129" font-size="21" font-weight="700">Existing model</text><text x="775" y="167" font-size="17">Executable definition</text><text x="775" y="196" font-size="17">Source mappings</text><text x="775" y="225" font-size="17">Current metric behavior</text><path d="M910 283V315H550V347" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="360" width="640" height="136" rx="10" fill="#eee7fa" stroke="#cdbde4"/><text x="250" y="394" font-size="21" font-weight="700">Compare scope, then resolve the meaning</text><text x="250" y="432" font-size="17">Keep the evidence · Identify differences · Ask the owner</text><path d="M550 496V535" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="120" y="548" width="860" height="85" rx="10" fill="#f0edf5" stroke="#cdbde4"/><text x="140" y="582" font-size="21" font-weight="700">Reusable context + selected metric + repeatable checks</text></g></svg>