<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t"><title id="t">Three definitions yield different values before an explicit policy decision and checks</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c6cbf"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292f26"><text x="35" y="46" font-size="27" font-weight="700">A different answer can reveal a different definition</text><rect x="35" y="95" width="310" height="160" rx="10" fill="white" stroke="#cdbde4"/><text x="55" y="129" font-size="21" font-weight="700">Existing model</text><text x="55" y="167" font-size="17">All order amounts</text><text x="55" y="196" font-size="17">$450</text><rect x="395" y="95" width="310" height="160" rx="10" fill="white" stroke="#cdbde4"/><text x="415" y="129" font-size="21" font-weight="700">Legacy report</text><text x="415" y="167" font-size="17">Completed amounts</text><text x="415" y="196" font-size="17">$250</text><rect x="755" y="95" width="310" height="160" rx="10" fill="white" stroke="#cdbde4"/><text x="775" y="129" font-size="21" font-weight="700">Selected policy</text><text x="775" y="167" font-size="17">Completed less refunds</text><text x="775" y="196" font-size="17">$230</text><path d="M550 255V298" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="313" width="760" height="110" rx="10" fill="#eee7fa" stroke="#cdbde4"/><text x="190" y="347" font-size="21" font-weight="700">Explicit policy choice: operational net sales</text><text x="190" y="385" font-size="17">The meaning is selected before numerical verification.</text><path d="M550 423V463" fill="none" stroke="#9a7ac5" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="478" width="760" height="104" rx="10" fill="white" stroke="#cdbde4"/><text x="190" y="512" font-size="21" font-weight="700">Execute and compare</text><text x="190" y="550" font-size="17">Reviewed model: 230 · East 130 · West 100</text></g></svg>