<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img"><title>Four stages for carrying a changed metric into the query</title><style>text{font-family:Inter,Arial,sans-serif;fill:#242922}.title{font-size:38px;font-weight:600}.label{font-size:28px;font-weight:600}.body{font-size:26px;fill:#5f685b}.small{font-size:23px;fill:#5f685b}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c76b0"/></marker></defs><rect width="720" height="1420" rx="20" fill="#f5f4ee"/><text x="40" y="68" class="title">From a changed rule</text><text x="40" y="116" class="title">to a checked answer</text><text x="40" y="171" class="body">Employee orders: exclude from Nov 1.</text><rect x="40" y="215" width="640" height="205" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(66 248)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h48l16 16v60H0zM48 0v18h16M12 35h40M12 49h29M12 63h35"/></g><text x="170" y="265" class="title">Revise + check</text><text x="170" y="306" class="body">Project model</text><text x="170" y="353" class="body">Encode the Nov 1 rule</text><text x="170" y="390" class="body">Compare expected totals</text><path d="M360 423v23" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="452" width="640" height="205" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(66 485)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="70" height="76" rx="8"/><path d="m14 25 9 9 18-19M14 53h40M14 64h31"/></g><text x="170" y="502" class="title">Review + merge</text><text x="170" y="543" class="body">Semantic Hub</text><text x="170" y="590" class="body">Reviewers assess policy</text><text x="170" y="627" class="body">Admin merges the file</text><path d="M360 660v23" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="689" width="640" height="205" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(66 722)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 0h64v62H5zM19 15h36M19 28h25M37 42v39m-13-13 13 13 13-13"/></g><text x="170" y="739" class="title">Pull + index</text><text x="170" y="780" class="body">Consuming project</text><text x="170" y="827" class="body">Adopt the intended file</text><text x="170" y="864" class="body">Finish metric indexing</text><path d="M360 897v23" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="926" width="640" height="205" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(66 959)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h74v55H38L19 73V55H0zM15 17h40M15 31h30"/></g><text x="170" y="976" class="title">Retrieve + query</text><text x="170" y="1017" class="body">Datus Agent / DOSI</text><text x="170" y="1064" class="body">Read the definition</text><text x="170" y="1101" class="body">Query Q4 → 470</text><rect x="40" y="1190" width="640" height="126" rx="16" fill="#e8e0f3"/><text x="65" y="1235" class="label">Also review memories, saved SQL</text><text x="65" y="1278" class="label">and existing report snapshots.</text><text x="40" y="1362" class="body">Semantic Hub must be enabled;</text><text x="40" y="1399" class="body">appropriate permissions are required.</text></svg>