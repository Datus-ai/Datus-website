<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><title>How Datus carries a changed metric into analytical work</title><style>text{font-family:Inter,Arial,sans-serif;fill:#242922}.title{font-size:38px;font-weight:600}.label{font-size:28px;font-weight:600}.body{font-size:26px;fill:#5f685b}.small{font-size:23px;fill:#5f685b}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c76b0"/></marker></defs><rect width="1440" height="820" rx="20" fill="#f5f4ee"/><text x="55" y="70" class="title">A new rule needs to reach the query.</text><text x="55" y="120" class="body">Northstar: keep October employee orders; exclude them from November 1.</text><rect x="55" y="175" width="304" height="360" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(79 207)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h48l16 16v60H0zM48 0v18h16M12 35h40M12 49h29M12 63h35"/></g><text x="79" y="331" class="label">Revise + check</text><text x="79" y="376" class="small">Project model</text><text x="79" y="445" class="small">Encode the Nov 1 rule</text><text x="79" y="484" class="small">Compare expected totals</text><path d="M365 354h25" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="397" y="175" width="304" height="360" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(421 207)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="70" height="76" rx="8"/><path d="m14 25 9 9 18-19M14 53h40M14 64h31"/></g><text x="421" y="331" class="label">Review + merge</text><text x="421" y="376" class="small">Semantic Hub</text><text x="421" y="445" class="small">Reviewers assess policy</text><text x="421" y="484" class="small">Admin merges the file</text><path d="M707 354h25" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="739" y="175" width="304" height="360" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(763 207)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 0h64v62H5zM19 15h36M19 28h25M37 42v39m-13-13 13 13 13-13"/></g><text x="763" y="331" class="label">Pull + index</text><text x="763" y="376" class="small">Consuming project</text><text x="763" y="445" class="small">Adopt the intended file</text><text x="763" y="484" class="small">Finish metric indexing</text><path d="M1049 354h25" stroke="#8c76b0" stroke-width="3" marker-end="url(#arrow)"/><rect x="1081" y="175" width="304" height="360" rx="16" fill="#fff" stroke="#d5d8cc"/><g transform="translate(1105 207)" stroke="#7953b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h74v55H38L19 73V55H0zM15 17h40M15 31h30"/></g><text x="1105" y="331" class="label">Retrieve + query</text><text x="1105" y="376" class="small">Datus Agent / DOSI</text><text x="1105" y="445" class="small">Read the definition</text><text x="1105" y="484" class="small">Query Q4 → 470</text><rect x="55" y="595" width="1330" height="138" rx="16" fill="#e8e0f3"/><text x="82" y="643" class="label">Review existing memories, saved SQL and report snapshots.</text><text x="82" y="692" class="body">A model update does not rewrite every earlier conversation or report.</text><text x="55" y="784" class="small">Semantic Hub requires an enabled deployment and appropriate permissions.</text></svg>