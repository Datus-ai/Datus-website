<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">One model, several ways to ask</title><desc id="d">The warehouse holds records; the model defines calculations; consumers request results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7662af"/></marker></defs><rect width="100%" height="100%" fill="#faf9f6"/><text x="42" y="48" fill="#20251f" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">One model, several ways to ask</text><text x="42" y="80" fill="#5c635c" font-family="Inter,Arial,sans-serif" font-size="17">The warehouse holds records; the model defines calculations; consumers request results.</text><path d="M315 178H355" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="115" font-family="Arial,sans-serif" font-size="16" fill="#514267">records</text><path d="M818 230V305" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="830" y="274" font-family="Arial,sans-serif" font-size="16" fill="#514267">informs</text><path d="M680 362H640" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="586" y="295" font-family="Arial,sans-serif" font-size="16" fill="#514267">definitions</text><path d="M498 310V235" marker-start="url(#arrow)" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="512" y="280" font-family="Arial,sans-serif" font-size="16" fill="#514267">SQL / results</text><path d="M315 340H355" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="294" font-family="Arial,sans-serif" font-size="16" fill="#514267">request</text><path d="M360 387H320" fill="none" stroke="#7662af" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="444" font-family="Arial,sans-serif" font-size="16" fill="#514267">result</text><rect x="40" y="125" width="275" height="105" rx="12" fill="#ffffff" stroke="#cfd4cd"/><text x="58" y="157" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Watch records</text><text x="58" y="185" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Runs, laps, sleep and HR</text><text x="58" y="209" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Ingestion / normalization</text><rect x="360" y="125" width="275" height="105" rx="12" fill="#ffffff" stroke="#cfd4cd"/><text x="378" y="157" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Warehouse</text><text x="378" y="185" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Personal: StarRocks</text><text x="378" y="209" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Local example: DuckDB</text><rect x="680" y="125" width="275" height="105" rx="12" fill="#ffffff" stroke="#cfd4cd"/><text x="698" y="157" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Running knowledge</text><text x="698" y="185" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Metric contracts and</text><text x="698" y="209" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">rules reviewed by a person</text><rect x="680" y="310" width="275" height="105" rx="12" fill="#ece6ff" stroke="#9980dd"/><text x="698" y="342" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Semantic model</text><text x="698" y="370" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Sources, grains, time</text><text x="698" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">and metric expressions</text><rect x="360" y="310" width="275" height="105" rx="12" fill="#ece6ff" stroke="#9980dd"/><text x="378" y="342" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">DOSI</text><text x="378" y="370" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Compile metric requests</text><text x="378" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Execute against warehouse</text><rect x="40" y="310" width="275" height="105" rx="12" fill="#ffffff" stroke="#cfd4cd"/><text x="58" y="342" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Consumers</text><text x="58" y="370" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Agent, dashboard, report</text><text x="58" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Must use the verified path</text><rect x="40" y="495" width="915" height="80" rx="12" fill="#ffffff" stroke="#cfd4cd"/><text x="58" y="527" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#252922">Datus Studio</text><text x="58" y="555" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52594f">Workspace for authoring, inspecting the model, asking questions and checking evidence</text></svg>