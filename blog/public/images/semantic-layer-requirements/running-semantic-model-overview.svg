<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="t d"><title id="t">The running semantic model: records become metrics</title><desc id="d">A focused subset of the real model, with different grains kept separate.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8069b7"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><text x="35" y="45" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#242922">The running semantic model: records become metrics</text><text x="35" y="79" font-family="Arial,sans-serif" font-size="17" fill="#576052">A focused subset of the real model, with different grains kept separate.</text><path d="M305 220H360" fill="none" stroke="#8069b7" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 220H690" fill="none" stroke="#8069b7" stroke-width="2.5" marker-end="url(#a)"/><path d="M305 455H360" fill="none" stroke="#8069b7" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 455H690" fill="none" stroke="#8069b7" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="130" width="270" height="180" rx="10" fill="#fff" stroke="#c9c5ce"/><text x="51" y="159" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Running records</text><text x="51" y="188" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Activities and workout events</text><text x="51" y="213" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Deduplicated running view</text><text x="51" y="238" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Time + measured distance</text><rect x="365" y="130" width="270" height="180" rx="10" fill="#eee8ff" stroke="#c9c5ce"/><text x="381" y="159" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Running dataset</text><text x="381" y="188" font-family="Arial,sans-serif" font-size="16" fill="#50594c">running_observation</text><text x="381" y="213" font-family="Arial,sans-serif" font-size="16" fill="#50594c">A measured observation</text><text x="381" y="238" font-family="Arial,sans-serif" font-size="16" fill="#50594c">linked to its athlete</text><rect x="695" y="130" width="270" height="180" rx="10" fill="#fff" stroke="#c9c5ce"/><text x="711" y="159" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Running metrics</text><text x="711" y="188" font-family="Arial,sans-serif" font-size="16" fill="#50594c">measured_run_distance_km</text><text x="711" y="213" font-family="Arial,sans-serif" font-size="16" fill="#50594c">measured_pace_s_per_km</text><text x="711" y="238" font-family="Arial,sans-serif" font-size="16" fill="#50594c">run_session_count</text><text x="711" y="263" font-family="Arial,sans-serif" font-size="16" fill="#50594c">run_day_count</text><rect x="35" y="380" width="270" height="150" rx="10" fill="#fff" stroke="#c9c5ce"/><text x="51" y="409" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Daily health records</text><text x="51" y="438" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Main sleep</text><text x="51" y="463" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Resting heart rate</text><text x="51" y="488" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Date and source coverage</text><rect x="365" y="380" width="270" height="150" rx="10" fill="#eee8ff" stroke="#c9c5ce"/><text x="381" y="409" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Daily datasets</text><text x="381" y="438" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Separate daily observations</text><text x="381" y="463" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Avoid weighting a day twice</text><text x="381" y="488" font-family="Arial,sans-serif" font-size="16" fill="#50594c">when joining multiple runs</text><rect x="695" y="380" width="270" height="150" rx="10" fill="#fff" stroke="#c9c5ce"/><text x="711" y="409" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Health metrics</text><text x="711" y="438" font-family="Arial,sans-serif" font-size="16" fill="#50594c">avg_main_sleep_minutes</text><text x="711" y="463" font-family="Arial,sans-serif" font-size="16" fill="#50594c">avg_resting_hr_bpm</text><text x="711" y="488" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Keep missing days visible</text><rect x="35" y="590" width="930" height="85" rx="10" fill="#fff" stroke="#c9c5ce"/><text x="51" y="619" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242922">Shared request scope</text><text x="51" y="648" font-family="Arial,sans-serif" font-size="16" fill="#50594c">Athlete identity + time window + grouping + model revision. Each consumer must use the checked path.</text></svg>