<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">How Datus takes a candidate finding to reviewed context</title>
<desc id="desc">Existing business definitions and data help Datus Agent draft a reusable metric. Datus checks the model and compares its results with trusted SQL, then helps investigate a candidate finding on separate data. A human owner approves its scope before sharing it.</desc>
<defs><style>text{font-family:Inter,system-ui,Arial,sans-serif}.h{font-size:32px;font-weight:750;fill:#17151f}.sub{font-size:16px;fill:#5d5968}.step{font-size:20px;font-weight:720;fill:#2f2551}.body{font-size:15px;fill:#514b5e}.tag{font-size:12px;font-weight:720;letter-spacing:.7px;fill:#6546bd}.flow{fill:none;stroke:#8a70e9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#8a70e9" stroke-width="1.8"/></marker></defs>
<rect width="1200" height="700" rx="24" fill="#f7f5fc"/>
<text x="48" y="62" class="h">How Datus supports the validation loop</text><text x="48" y="92" class="sub">Northstar example · definition → checks → evidence → scoped reuse</text>
<g transform="translate(48 135)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">1</text><text x="57" y="40" class="step">Gather business logic</text><text x="20" y="85" class="body">Docs, trusted SQL, warehouse schema</text><text x="20" y="111" class="body">Owner sets cohort and date rules</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">DATUS STUDIO · REVIEW PROJECT</text></g>
<g transform="translate(430 135)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">2</text><text x="57" y="40" class="step">Define the metric</text><text x="20" y="85" class="body">Datus Agent drafts the model</text><text x="20" y="111" class="body">Owner reviews cohort and formula</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">REUSABLE DEFINITION · DOSI</text></g>
<g transform="translate(812 135)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">3</text><text x="57" y="40" class="step">Check the model</text><text x="20" y="85" class="body">Datus checks the definition</text><text x="20" y="111" class="body">Team inspects the calculation</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">VALID MODEL ≠ RIGHT POLICY</text></g>
<path class="flow" d="M392 231h31" marker-end="url(#arrow)"/><path class="flow" d="M774 231h31" marker-end="url(#arrow)"/><path class="flow" d="M982 333v29" marker-end="url(#arrow)"/>
<g transform="translate(48 374)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">6</text><text x="57" y="40" class="step">Owner decides scope</text><text x="20" y="85" class="body">Review evidence, version, limits</text><text x="20" y="111" class="body">Approve definition or finding</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">HUMAN APPROVAL REQUIRED</text></g>
<g transform="translate(430 374)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">5</text><text x="57" y="40" class="step">Investigate the pattern</text><text x="20" y="85" class="body">Compare customer groups</text><text x="20" y="111" class="body">Test same claim on new data</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">CANDIDATE · NOT YET A RULE</text></g>
<g transform="translate(812 374)"><rect width="340" height="192" rx="18" fill="white" stroke="#d8d0f5" stroke-width="2"/><circle cx="29" cy="32" r="18" fill="#e9e3ff"/><text x="29" y="37" text-anchor="middle" class="tag">4</text><text x="57" y="40" class="step">Compare trusted results</text><text x="20" y="85" class="body">Same customers, period, groups</text><text x="20" y="111" class="body">Resolve differences with owner</text><path d="M20 138h300" stroke="#e2ddef"/><text x="20" y="164" class="tag">METRIC VS. TRUSTED QUERY</text></g>
<path class="flow" d="M808 470h-31" marker-end="url(#arrow)"/><path class="flow" d="M426 470h-31" marker-end="url(#arrow)"/><path class="flow" d="M218 572v29" marker-end="url(#arrow)"/>
<rect x="48" y="611" width="1104" height="56" rx="14" fill="#302747"/><text x="70" y="646" font-family="Inter,system-ui,Arial" font-size="19" font-weight="700" fill="white">Share only approved context · recheck it when data or logic changes</text>
<text x="48" y="691" class="sub">Illustrative workflow. Datus supports checks; the responsible owner controls approval and operational use.</text>
</svg>
