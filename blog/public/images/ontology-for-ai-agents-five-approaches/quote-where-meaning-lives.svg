<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Where meaning lives</title>
  <desc id="desc">Editorial quote card in Datus violet: The interesting disagreement is not whether meaning matters. It is where that meaning should live.</desc>
  <rect width="1200" height="540" fill="#eeebfb"/>
  <path d="M55 55H1145" stroke="#402df3" stroke-width="3"/>
  <text x="55" y="94" fill="#402df3" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DATUS / AGENT CONTEXT</text>
  <path d="M77 414C185 398 172 145 301 169S456 397 558 352" fill="none" stroke="#cabfff" stroke-width="2"/>
  <g fill="#402df3"><circle cx="77" cy="414" r="7"/><circle cx="301" cy="169" r="7"/><circle cx="558" cy="352" r="7"/></g>
  <text x="89" y="256" fill="#402df3" font-family="Arial,Helvetica,sans-serif" font-size="102" font-weight="700">“</text>
  <text x="145" y="257" fill="#181818" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="-1.3">The interesting disagreement is not</text>
  <text x="145" y="320" fill="#181818" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="-1.3">whether meaning matters.</text>
  <text x="145" y="383" fill="#402df3" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="-1.3">It is where that meaning should live.</text>
  <path d="M55 463H1145" stroke="#c9c0f6" stroke-width="2"/>
  <text x="55" y="503" fill="#5c5869" font-family="Arial,Helvetica,sans-serif" font-size="17">ONTOLOGY FOR AI AGENTS  ·  FIVE APPROACHES</text>
  <circle cx="1081" cy="119" r="34" fill="none" stroke="#cabfff" stroke-width="2"/>
  <circle cx="1081" cy="119" r="9" fill="#402df3"/>
  <path d="M1081 85V60M1115 119h27M1081 153v23M1047 119h-27" stroke="#cabfff" stroke-width="2"/>
</svg>
