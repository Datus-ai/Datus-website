<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ontology for AI agents: where does business meaning live?</title>
  <desc id="desc">A Datus-style editorial cover. A flat violet path connects a warehouse, shared business meaning, and an AI agent, with subtle graph nodes and five architectural routes.</desc>
  <rect width="1200" height="630" fill="#f7f7f2"/>
  <path d="M56 54H1144" stroke="#402df3" stroke-width="3"/>
  <text x="56" y="92" fill="#402df3" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DATUS / FIELD GUIDE</text>
  <text x="56" y="205" fill="#181818" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="650" letter-spacing="-2">Ontology for AI agents</text>
  <text x="56" y="275" fill="#181818" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="500" letter-spacing="-1.4">Where does business meaning live?</text>
  <text x="56" y="324" fill="#66645f" font-family="Arial,Helvetica,sans-serif" font-size="20">Five architectural approaches to a shared context</text>

  <g stroke="#c5bdf8" fill="none" stroke-width="2">
    <path d="M56 376H1144"/>
    <path d="M56 560H1144"/>
  </g>

  <!-- Three connected planes: source data, explicit business meaning, agent. -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="56" y="406" width="236" height="120" rx="6" fill="#ffffff" stroke="#cfc9e9" stroke-width="2"/>
    <path d="M79 439H270M79 463H270M79 487H232" stroke="#afa6df" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="586" fill="#5e5b65" font-size="17" font-weight="700" letter-spacing="2">SOURCES</text>

    <path d="M292 466H382" stroke="#402df3" stroke-width="3"/>
    <path d="m373 456 11 10-11 10" fill="none" stroke="#402df3" stroke-width="3" stroke-linejoin="round"/>

    <rect x="393" y="390" width="410" height="153" rx="7" fill="#402df3"/>
    <circle cx="445" cy="443" r="15" fill="none" stroke="#d8d0ff" stroke-width="2.5"/>
    <circle cx="512" cy="420" r="10" fill="none" stroke="#d8d0ff" stroke-width="2.5"/>
    <circle cx="523" cy="486" r="12" fill="none" stroke="#d8d0ff" stroke-width="2.5"/>
    <path d="M458 438 503 423M456 453 512 482M514 431l7 43" stroke="#d8d0ff" stroke-width="2"/>
    <text x="560" y="449" fill="#ffffff" font-size="24" font-weight="650">Business meaning</text>
    <text x="560" y="480" fill="#e6e0ff" font-size="15">Metrics · entities · relationships</text>
    <text x="393" y="586" fill="#402df3" font-size="17" font-weight="700" letter-spacing="2">SHARED CONTEXT</text>

    <path d="M803 466H883" stroke="#402df3" stroke-width="3"/>
    <path d="m874 456 11 10-11 10" fill="none" stroke="#402df3" stroke-width="3" stroke-linejoin="round"/>

    <rect x="894" y="406" width="250" height="120" rx="6" fill="#ffffff" stroke="#cfc9e9" stroke-width="2"/>
    <circle cx="962" cy="465" r="22" fill="none" stroke="#402df3" stroke-width="3"/>
    <path d="M962 443V425M962 487v18M940 465h-17M984 465h17" stroke="#402df3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="962" cy="465" r="6" fill="#402df3"/>
    <text x="1015" y="474" fill="#181818" font-size="26" font-weight="600">Agent</text>
    <text x="894" y="586" fill="#5e5b65" font-size="17" font-weight="700" letter-spacing="2">CONSUMER</text>
  </g>

  <!-- The five small markers refer to the five approaches without duplicating the explainer. -->
  <g fill="#402df3">
    <circle cx="628" cy="363" r="5"/>
    <circle cx="648" cy="363" r="5" opacity=".75"/>
    <circle cx="668" cy="363" r="5" opacity=".55"/>
    <circle cx="688" cy="363" r="5" opacity=".35"/>
    <circle cx="708" cy="363" r="5" opacity=".2"/>
  </g>
</svg>
