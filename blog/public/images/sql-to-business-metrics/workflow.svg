<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><style>text{font-family:Inter,Arial,sans-serif;fill:#202420}.muted{fill:#67706a}.tiny{font-size:16px}.label{font-size:20px;font-weight:600}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8968c7"/></marker></defs><rect width="1440" height="760" rx="20" fill="#f4f4ee"/><text x="60" y="72" style="font-size:32px;font-weight:600">Keep the meaning. Reuse the calculation.</text><text x="60" y="110" class="muted" font-size="19">Illustrative workflow · fictional USD order data</text><rect x="60" y="205" width="290" height="260" rx="16" fill="white" stroke="#d3d6ce"/><text x="84" y="252" class="label">Existing SQL</text><text x="84" y="310" font-size="18">Completed orders</text><text x="84" y="350" font-size="18">Exclude test orders</text><text x="84" y="390" font-size="18">Subtract refunds</text><path d="M355 335h30" stroke="#8968c7" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="205" width="290" height="260" rx="16" fill="white" stroke="#d3d6ce"/><text x="414" y="252" class="label">Datus models</text><text x="414" y="310" font-size="18">Inspect live schema</text><text x="414" y="350" font-size="18">Preserve calculation rules</text><text x="414" y="390" font-size="18">Name the metric</text><path d="M685 335h30" stroke="#8968c7" stroke-width="3" marker-end="url(#a)"/><rect x="720" y="205" width="290" height="260" rx="16" fill="white" stroke="#d3d6ce"/><text x="744" y="252" class="label">Compare outputs</text><text x="744" y="310" font-size="18">Same period and grouping</text><text x="744" y="350" font-size="18">Reference SQL ↔ model</text><text x="744" y="390" font-size="18">Review check status</text><path d="M1015 335h30" stroke="#8968c7" stroke-width="3" marker-end="url(#a)"/><rect x="1050" y="205" width="290" height="260" rx="16" fill="white" stroke="#d3d6ce"/><text x="1074" y="252" class="label">Reuse the metric</text><text x="1074" y="310" font-size="18">November by region</text><text x="1074" y="350" font-size="18">Company-wide total</text><text x="1074" y="390" font-size="18">Same calculation rules</text><rect x="390" y="515" width="620" height="85" rx="12" fill="#e8e0fa"/><text x="420" y="550" class="label">Team review</text><text x="420" y="580" font-size="18">Does the definition express the intended business rule?</text><path d="M700 515v-28" stroke="#8968c7" stroke-width="2"/><text x="60" y="670" font-size="19">October reference = model: North 210 · South 90</text><text x="60" y="708" class="muted" font-size="18">A matching result checks the chosen scope. It does not establish business approval.</text></svg>