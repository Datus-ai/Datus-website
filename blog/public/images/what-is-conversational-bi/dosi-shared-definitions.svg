<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">Dosi: shared business definitions across tools and data sources</title>
  <desc id="desc">A conversational application, an AI agent, and an analytics application call Dosi. Dosi uses a shared Apache Ossie model to find metrics, check queries, and run queries against a selected supported data source. Applications manage conversation and user access. Multiple supported sources do not imply automatic cross-source joins.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="700" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="380" y="49" fill="#0f172a" font-size="28" font-weight="700">One model. Different interfaces.</text>
    <text x="380" y="81" fill="#475569" font-size="18">Business meaning stays reusable with Dosi</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="32" y="111" width="216" height="76" rx="12"/>
      <rect x="272" y="111" width="216" height="76" rx="12"/>
      <rect x="512" y="111" width="216" height="76" rx="12"/>
    </g>
    <g fill="#0f172a" font-size="21" font-weight="600">
      <text x="140" y="143">Conversational</text><text x="140" y="168">application</text>
      <text x="380" y="156">AI agent</text>
      <text x="620" y="143">Analytics</text><text x="620" y="168">application</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M140 187V245"/><path d="M380 187V245"/><path d="M620 187V245"/>
    </g>
    <rect x="32" y="247" width="696" height="206" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="380" y="284" fill="#3730a3" font-size="28" font-weight="700">Dosi semantic engine</text>
    <rect x="68" y="303" width="624" height="81" rx="10" fill="#fff" stroke="#c7d2fe"/>
    <text x="380" y="334" fill="#0f172a" font-size="21" font-weight="600">Shared Apache Ossie model</text>
    <text x="380" y="365" fill="#475569" font-size="19">Metric definitions · dimensions · relationships</text>
    <text x="380" y="422" fill="#3730a3" font-size="21" font-weight="600">Find metrics → Check query → Run query</text>
    <path d="M380 453V497" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="528" fill="#475569" font-size="19">Native queries to the selected supported source</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M380 540V553H140V570" marker-end="url(#arrow)"/>
      <path d="M380 553V570" marker-end="url(#arrow)"/>
      <path d="M380 553H620V570" marker-end="url(#arrow)"/>
    </g>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="32" y="574" width="216" height="62" rx="12"/>
      <rect x="272" y="574" width="216" height="62" rx="12"/>
      <rect x="512" y="574" width="216" height="62" rx="12"/>
    </g>
    <g fill="#0f172a" font-size="20" font-weight="600">
      <text x="140" y="612">Database</text><text x="380" y="612">Warehouse</text><text x="620" y="612">Lakehouse engine</text>
    </g>
    <text x="380" y="675" fill="#475569" font-size="18">Vendor-neutral definitions, independent of one interface</text>
  </g>
</svg>
