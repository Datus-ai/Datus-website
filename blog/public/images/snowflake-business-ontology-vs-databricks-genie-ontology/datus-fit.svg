<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Where Datus fits across warehouse platforms</title><desc id="desc">Existing SQL and documents feed Datus Agent in Studio. The team reviews an Apache Ossie model. Datus and external agents request metrics through DOSI, which compiles SQL for one configured supported warehouse per request. Existing native ontology definitions are reconciled by the team; no automatic sync is shown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8463bc"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#252a24}.title{font-size:25px;font-weight:600}.body{font-size:20px}.muted{font-size:18px;fill:#63705d}.line{fill:none;stroke:#8463bc;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1600" height="1120" rx="20" fill="#f4f4ee"/><text x="50" y="63" style="font-size:36px;font-weight:600">Datus fits between business knowledge, agents, and your warehouse.</text><text x="50" y="105" class="muted">Reuse an inspectable model; keep SQL execution on the selected warehouse.</text><rect x="390" y="140" width="1160" height="525" rx="20" fill="#eee8f7"/><text x="420" y="181" class="muted">DATUS MODELING + SEMANTIC EXECUTION</text><rect x="50" y="220" width="280" height="145" rx="13" fill="white" stroke="#cbd1c4"/><text x="74" y="260" class="title">Existing knowledge</text><text x="74" y="297" class="body">SQL · documents</text><text x="74" y="328" class="body">Table information</text><rect x="440" y="215" width="500" height="130" rx="13" fill="white" stroke="#cbd1c4"/><text x="464" y="255" class="title">Datus Agent in Studio</text><text x="464" y="292" class="body">Build candidate definitions from evidence</text><rect x="440" y="420" width="500" height="170" rx="13" fill="white" stroke="#cbd1c4"/><text x="464" y="460" class="title">Apache Ossie model</text><text x="464" y="497" class="body">Team review + reference-result checks</text><text x="464" y="528" class="body">Datasets · metrics · source mappings</text><rect x="1035" y="215" width="465" height="130" rx="13" fill="white" stroke="#cbd1c4"/><text x="1059" y="255" class="title">People + analytical agents</text><text x="1059" y="292" class="body">Datus Studio · external MCP clients</text><rect x="1035" y="420" width="465" height="170" rx="13" fill="#6545aa" stroke="#cbd1c4"/><text x="1059" y="460" class="title" style="fill:white">DOSI semantic runtime</text><text x="1059" y="497" class="body" style="fill:white">Discover metrics · compile native SQL</text><text x="1059" y="528" class="body" style="fill:white">Execute via supported connections</text><path class="line" d="M335 280H430"/><path class="line" d="M690 350V410"/><path class="line" d="M945 505H1025"/><path class="line" d="M1265 350V410"/><text x="1290" y="387" class="muted">Metric request / result</text><rect x="50" y="455" width="280" height="205" rx="13" fill="white" stroke="#cbd1c4"/><text x="74" y="495" class="title">Native context</text><text x="74" y="531" class="muted">Snowflake Business Ontology</text><text x="74" y="560" class="muted">+ Semantic Views</text><text x="74" y="601" class="muted">Databricks Genie Ontology</text><text x="74" y="630" class="muted">+ Metric Views</text><path d="M335 520H430" fill="none" stroke="#a296b1" stroke-width="2" stroke-dasharray="7 6"/><text x="50" y="704" class="muted">Team reconciles definitions.</text><text x="50" y="733" class="muted">No automatic ontology sync.</text><path class="line" d="M1265 595V750H610V835"/><path d="M1265 750H1370" fill="none" stroke="#8463bc" stroke-width="3"/><path class="line" d="M990 750V835"/><path class="line" d="M1370 750V835"/><text x="585" y="705" class="body">Native SQL / returned results · one configured source per request</text><rect x="440" y="845" width="340" height="145" rx="13" fill="white" stroke="#cbd1c4"/><text x="464" y="885" class="title">Snowflake</text><text x="464" y="922" class="body">Existing warehouse</text><text x="464" y="953" class="body">Snowflake SQL API</text><rect x="820" y="845" width="340" height="145" rx="13" fill="white" stroke="#cbd1c4"/><text x="844" y="885" class="title">Databricks</text><text x="844" y="922" class="body">Existing SQL warehouse</text><text x="844" y="953" class="body">Statement Execution API</text><rect x="1200" y="845" width="340" height="145" rx="13" fill="white" stroke="#cbd1c4"/><text x="1224" y="885" class="title">Other supported engines</text><text x="1224" y="922" class="body">PostgreSQL · ClickHouse</text><text x="1224" y="953" class="body">DuckDB · more</text><text x="440" y="1040" class="body">Data storage and query execution stay with the selected backend.</text><text x="50" y="1090" class="muted">Logical overview · no cross-warehouse federation or transfer of native approvals implied · connector support varies.</text></svg>