<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Semantic Layer vs Ontology</title>
<desc id="desc">A semantic layer governs metrics, dimensions, and calculations. An ontology maps entities, relationships, and business meaning. Together they ground AI agents.</desc>
<rect width="1200" height="750" fill="#f7f7f2"/>
<path d="M600 126V560" stroke="#d8d1ec" stroke-width="2"/>
<g font-family="Arial, sans-serif" fill="#171a17">
<text x="64" y="84" font-size="18" letter-spacing="4" fill="#402df3">DATUS / TWO LAYERS OF CONTEXT</text>
<text x="64" y="170" font-size="44" letter-spacing="-1.4">Semantic Layer</text>
<text x="664" y="170" font-size="44" letter-spacing="-1.4">Ontology</text>
<text x="64" y="218" font-size="24" fill="#54564f">How is it calculated?</text>
<text x="664" y="218" font-size="24" fill="#54564f">How is it connected?</text>
<rect x="64" y="275" width="470" height="92" rx="5" fill="#402df3"/>
<text x="94" y="332" fill="#fff" font-size="32">Metrics</text>
<rect x="64" y="383" width="222" height="80" rx="5" fill="#eeebfb" stroke="#b3a4ff"/>
<rect x="304" y="383" width="230" height="80" rx="5" fill="#eeebfb" stroke="#b3a4ff"/>
<text x="84" y="432" font-size="27" fill="#402df3">Dimensions</text>
<text x="329" y="432" font-size="27" fill="#402df3">Calculations</text>
<text x="64" y="518" font-size="23" fill="#54564f">Governed, consistent numbers</text>
<g stroke="#402df3" stroke-width="3" fill="none"><path d="M900 330L770 435M900 330l130 105M770 435h260"/></g>
<rect x="791" y="275" width="218" height="82" rx="41" fill="#402df3"/>
<text x="900" y="325" text-anchor="middle" font-size="30" fill="#fff">Entities</text>
<rect x="645" y="401" width="257" height="78" rx="39" fill="#eeebfb" stroke="#402df3" stroke-width="2"/>
<text x="773" y="449" text-anchor="middle" font-size="25" fill="#402df3">Relationships</text>
<rect x="925" y="401" width="230" height="78" rx="39" fill="#eeebfb" stroke="#402df3" stroke-width="2"/>
<text x="1040" y="449" text-anchor="middle" font-size="25" fill="#402df3">Meaning</text>
<text x="664" y="530" font-size="23" fill="#54564f">Connected business context</text>
<rect x="64" y="597" width="1072" height="93" rx="5" fill="#171a17"/>
<text x="600" y="654" text-anchor="middle" font-size="30" fill="#f7f7f2">Trusted metrics + business meaning → grounded AI agents</text>
</g></svg>
