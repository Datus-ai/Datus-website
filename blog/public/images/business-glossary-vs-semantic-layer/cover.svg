<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Business glossary and semantic layer, from terms to SQL</title>
  <desc id="desc">An approved active paying customer definition flows to a governed semantic metric and then to a dashboard and agent answer, with a review loop back to the definition.</desc>
  <rect width="1200" height="630" fill="#f7f7f2"/>
  <path d="M48 54H1152" stroke="#402df3" stroke-width="3"/>
  <text x="48" y="88" fill="#402df3" font-family="Inter,system-ui,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DATUS / SEMANTIC LAYER</text>
  <text x="48" y="151" fill="#171717" font-family="Inter,system-ui,Arial,sans-serif" font-size="39" font-weight="700" letter-spacing="-1.3">From approved term to trusted answer</text>
  <text x="48" y="186" fill="#676761" font-family="Inter,system-ui,Arial,sans-serif" font-size="19">One decision about meaning. One tested path to data.</text>

  <g font-family="Inter,system-ui,Arial,sans-serif">
    <rect x="48" y="244" width="328" height="230" rx="12" fill="#ffffff" stroke="#c9c1fb" stroke-width="2"/>
    <text x="72" y="280" fill="#402df3" font-size="14" font-weight="700" letter-spacing="2">01 / BUSINESS GLOSSARY</text>
    <text x="72" y="326" fill="#171717" font-size="26" font-weight="700">Active paying customer</text>
    <path d="M72 346H352" stroke="#e6e2ff" stroke-width="2"/>
    <text x="72" y="380" fill="#535450" font-size="18">Paying account</text>
    <text x="72" y="409" fill="#535450" font-size="18">+ completed order in 30 days</text>
    <text x="72" y="446" fill="#807f78" font-size="15">Owner approves the meaning</text>

    <rect x="436" y="244" width="328" height="230" rx="12" fill="#402df3"/>
    <text x="460" y="280" fill="#d9d3ff" font-size="14" font-weight="700" letter-spacing="2">02 / SEMANTIC MODEL</text>
    <text x="460" y="326" fill="#ffffff" font-size="26" font-weight="700">One governed metric</text>
    <path d="M460 346H740" stroke="#9487f8" stroke-width="2"/>
    <text x="460" y="380" fill="#ffffff" font-size="18">accounts ↔ orders</text>
    <text x="460" y="409" fill="#ffffff" font-size="18">filter · time · distinct count</text>
    <text x="460" y="446" fill="#d9d3ff" font-size="15">Model and test the rule</text>

    <rect x="824" y="244" width="328" height="230" rx="12" fill="#ffffff" stroke="#c9c1fb" stroke-width="2"/>
    <text x="848" y="280" fill="#402df3" font-size="14" font-weight="700" letter-spacing="2">03 / SHARED ANSWER</text>
    <text x="848" y="326" fill="#171717" font-size="26" font-weight="700">One checked result</text>
    <path d="M848 346H1128" stroke="#e6e2ff" stroke-width="2"/>
    <text x="848" y="380" fill="#535450" font-size="18">Dashboard + AI agent</text>
    <text x="848" y="424" fill="#402df3" font-size="40" font-weight="700">1 customer</text>
    <text x="848" y="446" fill="#807f78" font-size="15">In the sample dataset</text>
  </g>

  <path d="M382 357H427M417 348L427 357L417 366M770 357H815M805 348L815 357L805 366" fill="none" stroke="#402df3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 493V537H212V493" fill="none" stroke="#a99cf8" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M221 502L212 493L203 502" fill="none" stroke="#a99cf8" stroke-width="2"/>
  <text x="235" y="564" fill="#696866" font-family="Inter,system-ui,Arial,sans-serif" font-size="16">Definition changes? Re-review the metric and expected result.</text>
</svg>
