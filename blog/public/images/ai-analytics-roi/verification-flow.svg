<text x="955" y="272" font-size="24" font-weight="650" fill="#fff">Review</text><text x="955" y="312" font-size="19" fill="#d9d1ee">Check scope</text><text x="955" y="340" font-size="19" fill="#d9d1ee">and findings</text>
<path d="M1038 386v66H473v-56" fill="none" stroke="#796d94" stroke-width="2" marker-end="url(#a)"/><rect x="644" y="436" width="250" height="30" fill="#f7f7f2"/><text x="769" y="458" text-anchor="middle" font-size="18" fill="#71697d">Clarify or correct, then rerun</text>
