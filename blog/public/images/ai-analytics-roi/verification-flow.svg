<text x="666" y="272" font-size="24" font-weight="650" fill="#402df3">DOSI + data</text><text x="666" y="312" font-size="19" fill="#594a7a">Calculate with the</text><text x="666" y="340" font-size="19" fill="#594a7a">shared definition</text>
<rect x="931" y="183" width="214" height="203" rx="12" fill="#191d1a"/>
