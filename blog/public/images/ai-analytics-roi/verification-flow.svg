<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">A focused review, backed by shared definitions</title><desc id="desc">The team reviews a sales definition. Datus Agent matches the question to a metric; DOSI calculates it against the data source. The reviewer checks interpretation, period, results and evidence, then uses the finding or requests a correction. Model and SQL inspection support deeper checks; data freshness and causal explanations need separate evidence.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="none" stroke="#796d94" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" rx="20" fill="#f7f7f2"/>
<g font-family="Inter,Arial,sans-serif" fill="#191d1a"><text x="55" y="62" font-size="31" font-weight="650">A focused review, backed by shared definitions</text><text x="55" y="100" font-size="20" fill="#71697d">Northstar example · Why did net sales fall last week?</text></g>
