<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1050" viewBox="0 0 600 1050" role="img" aria-labelledby="t d"><title id="t">From question to reviewed finding</title><desc id="d">Use a reviewed metric definition, match the question with Datus Agent, calculate through DOSI, then review the scope and evidence before using the result. Clarify and rerun when needed.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="none" stroke="#796d94" stroke-width="1.5"/></marker></defs><rect width="600" height="1050" rx="20" fill="#f7f7f2"/><g font-family="Inter,Arial,sans-serif"><text x="38" y="57" fill="#191d1a" font-size="29" font-weight="650">From question to reviewed finding</text><text x="38" y="98" fill="#71697d" font-size="24">Why did net sales fall last week?</text><g fill="none" stroke="#796d94" stroke-width="3" marker-end="url(#a)"><path d="M300 270v40M300 450v40M300 630v40"/></g><rect x="38" y="135" width="524" height="135" rx="12" fill="#fff" stroke="#d8d1e8"/><text x="64" y="182" fill="#191d1a" font-size="29" font-weight="650">Reviewed definition</text><text x="64" y="226" fill="#71697d" font-size="25">Net sales, refunds, period and scope</text><rect x="38" y="315" width="524" height="135" rx="12" fill="#eeebfb" stroke="#b3a4ff"/><text x="64" y="362" fill="#402df3" font-size="29" font-weight="650">Datus Agent</text><text x="64" y="406" fill="#594a7a" font-size="25">Match the question to a metric</text><rect x="38" y="495" width="524" height="135" rx="12" fill="#eeebfb" stroke="#b3a4ff"/><text x="64" y="542" fill="#402df3" font-size="29" font-weight="650">DOSI + data source</text><text x="64" y="586" fill="#594a7a" font-size="25">Calculate with the shared definition</text><rect x="38" y="675" width="524" height="156" rx="12" fill="#191d1a"/><text x="64" y="722" fill="#fff" font-size="29" font-weight="650">Review, then use the finding</text><text x="64" y="767" fill="#d9d1ee" font-size="25">Check scope, dates and evidence.</text><text x="64" y="802" fill="#d9d1ee" font-size="25">Clarify and rerun when needed.</text><text x="38" y="887" fill="#191d1a" font-size="25" font-weight="650">Deeper checks: model, SQL, lineage</text><path d="M38 915h524" stroke="#d8d1e8"/><g fill="#71697d" font-size="24"><text x="38" y="955">Still check source completeness</text><text x="38" y="990">and the evidence behind a cause.</text></g></g></svg>