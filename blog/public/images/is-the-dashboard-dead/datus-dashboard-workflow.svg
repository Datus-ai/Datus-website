<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Datus Agent turns a question into a live HTML dashboard</title>
  <desc id="desc">The documented CLI workflow: a business question reaches the gen_visual_dashboard agent. The agent uses existing semantic metrics when suitable, along with schema, reference SQL, and glossary context; ad-hoc SQL requires review. It creates an HTML dashboard and saved query templates. Filter changes call the local datus --web backend, which queries the datasource and refreshes the page.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#402df3" stroke-width="2"/></marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#887ced" stroke-width="2"/></marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d5e9"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="#f7f7f2"/>
  <rect width="1200" height="750" fill="url(#dots)" opacity=".45"/>
  <rect x="29" y="28" width="1142" height="694" rx="24" fill="#fdfdfa" stroke="#dedbe9" stroke-width="2"/>
  <g font-family="Inter,system-ui,Arial,sans-serif">
    <text x="69" y="76" fill="#402df3" font-size="15" font-weight="800" letter-spacing="2">DATUS AGENT · DOCUMENTED CLI WORKFLOW</text>
    <text x="69" y="120" fill="#242035" font-size="31" font-weight="750">A question becomes an interactive HTML dashboard</text>
    <text x="69" y="151" fill="#6c6680" font-size="16">Metric-first when a definition fits · SQL stays reviewable when it does not</text>

    <rect x="70" y="200" width="238" height="173" rx="18" fill="#eeeaff" stroke="#aaa0ed" stroke-width="2"/>
    <text x="94" y="237" fill="#6258a8" font-size="13" font-weight="750" letter-spacing="1">ASK</text>
    <text x="94" y="278" fill="#29233e" font-size="20" font-weight="680">Why did completed</text>
    <text x="94" y="309" fill="#29233e" font-size="20" font-weight="680">revenue change?</text>
    <text x="94" y="346" fill="#6258a8" font-size="14">“Filter by region”</text>

    <path d="M315 288H352" stroke="#402df3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="361" y="200" width="269" height="173" rx="18" fill="#402df3"/>
    <circle cx="402" cy="253" r="18" fill="none" stroke="#dcd7ff" stroke-width="2"/>
    <circle cx="402" cy="253" r="5" fill="#dcd7ff"/>
    <path d="M402 229v-8M426 253h8M402 277v8M378 253h-8" stroke="#dcd7ff" stroke-width="2"/>
    <text x="438" y="260" fill="white" font-size="22" font-weight="750">Datus Agent</text>
    <text x="389" y="307" fill="#e6e3ff" font-size="16">gen_visual_dashboard</text>
    <text x="389" y="339" fill="#e6e3ff" font-size="14">Plan · query · compose</text>

    <path d="M637 288H674" stroke="#402df3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="683" y="186" width="425" height="202" rx="18" fill="#fff" stroke="#b8b2d3" stroke-width="2"/>
    <rect x="683" y="186" width="425" height="43" rx="18" fill="#edeaff"/>
    <rect x="683" y="212" width="425" height="17" fill="#edeaff"/>
    <circle cx="709" cy="208" r="5" fill="#a396ed"/>
    <circle cx="726" cy="208" r="5" fill="#a396ed"/>
    <circle cx="743" cy="208" r="5" fill="#a396ed"/>
    <text x="777" y="214" fill="#554b8b" font-size="14">generated-dashboard.html</text>
    <text x="711" y="262" fill="#302a44" font-size="17" font-weight="700">HTML dashboard + saved SQL templates</text>
    <rect x="712" y="279" width="105" height="65" rx="7" fill="#f4f2ff"/>
    <rect x="830" y="279" width="105" height="65" rx="7" fill="#f4f2ff"/>
    <rect x="948" y="279" width="132" height="65" rx="7" fill="#f8f7fa" stroke="#ddd9e9"/>
    <text x="725" y="303" fill="#7168a9" font-size="11">KPI CARD</text>
    <text x="725" y="329" fill="#402df3" font-size="18" font-weight="700">Revenue</text>
    <text x="843" y="303" fill="#7168a9" font-size="11">CHART</text>
    <path d="M845 329 866 317 883 323 905 307 923 313" fill="none" stroke="#402df3" stroke-width="3"/>
    <text x="963" y="303" fill="#7168a9" font-size="11">FILTER</text>
    <text x="963" y="329" fill="#4f4765" font-size="17">Region ▾</text>
    <text x="712" y="367" fill="#696280" font-size="13">Charts · tables · filters · parameterized queries</text>

    <rect x="70" y="455" width="546" height="185" rx="17" fill="#f0edff" stroke="#b8aeed" stroke-width="2"/>
    <text x="96" y="494" fill="#5c51a4" font-size="13" font-weight="750" letter-spacing="1">CONTEXT FOR THE AGENT</text>
    <rect x="96" y="516" width="495" height="44" rx="8" fill="white"/>
    <circle cx="118" cy="538" r="7" fill="#402df3"/>
    <text x="137" y="545" fill="#302a44" font-size="16" font-weight="680">Existing semantic metric, when it fits</text>
    <text x="96" y="589" fill="#554d70" font-size="15">Schema · reference SQL · business glossary</text>
    <text x="96" y="617" fill="#8d5b68" font-size="14">SQL fallback is possible; review a new calculation</text>
    <path d="M497 448V382" fill="none" stroke="#887ced" stroke-width="2.5" marker-end="url(#arrowSoft)"/>

    <rect x="683" y="455" width="425" height="185" rx="17" fill="#fff" stroke="#b8b2d3" stroke-width="2"/>
    <text x="709" y="494" fill="#5c51a4" font-size="13" font-weight="750" letter-spacing="1">LIVE FILTER LOOP</text>
    <text x="709" y="532" fill="#302a44" font-size="18" font-weight="700">Filter changes → datus --web</text>
    <text x="709" y="566" fill="#554d70" font-size="15">Render template · query datasource</text>
    <text x="709" y="597" fill="#554d70" font-size="15">Return results · update charts</text>
    <path d="M897 449V398" fill="none" stroke="#887ced" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
    <path d="M1063 394V445" fill="none" stroke="#887ced" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
    <text x="69" y="690" fill="#736d83" font-size="14">CLI HTML sharing requires the matching local backend and datasource; published SaaS viewing is a separate path.</text>
  </g>
</svg>
