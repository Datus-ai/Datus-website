<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">After: agent-built views over governed semantic metrics</title><desc id="d">A business question reaches an agent. The agent selects reviewed metrics from a semantic model and composes a temporary HTML view or a persistent dashboard without duplicating the metric definition.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#402df3" stroke-width="2"/></marker></defs>
<rect width="1200" height="630" fill="#f7f7f2"/><rect x="28" y="28" width="1144" height="574" rx="24" fill="#fdfdfa" stroke="#dfdce9" stroke-width="2"/>
<g font-family="Inter,system-ui,Arial,sans-serif"><text x="64" y="86" fill="#402df3" font-size="15" font-weight="800" letter-spacing="2">AFTER</text><text x="64" y="137" fill="#252236" font-size="34" font-weight="700">The question shapes the view; the model holds the meaning</text>
<rect x="64" y="243" width="201" height="118" rx="17" fill="#eeeaff" stroke="#afa7f2"/><text x="89" y="277" fill="#6258a8" font-size="12" font-weight="700">QUESTION</text><text x="89" y="314" fill="#252236" font-size="18" font-weight="650">Why did revenue</text><text x="89" y="341" fill="#252236" font-size="18" font-weight="650">change this week?</text>
<path d="M270 302h52" stroke="#402df3" stroke-width="3" marker-end="url(#a)"/>
<rect x="330" y="243" width="207" height="118" rx="17" fill="#402df3"/><text x="357" y="280" fill="#e1ddff" font-size="12" font-weight="700">ANALYTICS AGENT</text><text x="357" y="319" fill="white" font-size="20" font-weight="700">Plan · query · build</text><text x="357" y="344" fill="#e1ddff" font-size="12">Revises the visual layout</text>
<path d="M543 302h55" stroke="#402df3" stroke-width="3" marker-end="url(#a)"/>
<rect x="607" y="226" width="225" height="153" rx="17" fill="#eeeaff" stroke="#9f95eb" stroke-width="2"/><text x="632" y="261" fill="#6258a8" font-size="12" font-weight="700">SEMANTIC MODEL</text><text x="632" y="299" fill="#252236" font-size="18" font-weight="650">Reviewed metrics</text><text x="632" y="330" fill="#252236" font-size="18" font-weight="650">Dimensions + rules</text><text x="632" y="356" fill="#6258a8" font-size="12">One reusable contract</text>
<path d="M838 302h47" stroke="#402df3" stroke-width="3" marker-end="url(#a)"/>
<g fill="#fff" stroke="#b6b0d5" stroke-width="2"><rect x="894" y="201" width="232" height="119" rx="15"/><rect x="894" y="338" width="232" height="119" rx="15"/></g><text x="916" y="238" fill="#252236" font-size="18" font-weight="700">HTML view</text><text x="916" y="264" fill="#6c6684" font-size="13">For this investigation</text><path d="M918 299h29l17-18 20 8 20-26 34 19 21-14" fill="none" stroke="#402df3" stroke-width="3"/>
<text x="916" y="375" fill="#252236" font-size="18" font-weight="700">Persistent dashboard</text><text x="916" y="401" fill="#6c6684" font-size="13">For recurring monitoring</text><rect x="918" y="418" width="42" height="18" rx="4" fill="#a99efa"/><rect x="967" y="418" width="42" height="18" rx="4" fill="#8170f1"/><rect x="1016" y="418" width="42" height="18" rx="4" fill="#5947e6"/>
<path d="M718 384v85H431V365" fill="none" stroke="#887ced" stroke-width="2" stroke-dasharray="6 6"/><text x="64" y="550" fill="#68627b" font-size="14">Illustrative architecture. Real access, query execution, and publishing still need a configured runtime.</text>
</g></svg>
