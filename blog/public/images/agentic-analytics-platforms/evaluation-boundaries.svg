<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">Four boundaries to evaluate</title><desc id="d">The same business question must retain its metric definition, access scope and evidence as it becomes a shared output.</desc><rect width="1200" height="750" fill="#f5f4ef"/><g font-family="Inter,system-ui,Arial,sans-serif"><text x="65" y="68" font-size="17" letter-spacing="2" fill="#6e637c">ONE QUESTION · EVERY CANDIDATE</text><text x="65" y="115" font-size="34" fill="#242128" font-weight="700">Why did net sales fall last week?</text></g><rect x="80" y="160" width="470" height="205" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><circle cx="120" cy="202" r="19" fill="#5436ee"/><text x="114" y="209" font-family="Inter,system-ui,Arial,sans-serif" fill="white" font-size="20">1</text><text x="155" y="210" font-family="Inter,system-ui,Arial,sans-serif" font-size="26" font-weight="700" fill="#29232f">Business definitions</text><text x="110" y="332" font-family="Inter,system-ui,Arial,sans-serif" font-size="21" fill="#68606f">Metric · grain · reporting week</text><g stroke="#8a73b4" stroke-width="3" fill="none"><path d="M115 250h130m-130 20h210m-210 20h170"/><path d="m430 250 20 20 35-35" stroke="#5436ee"/></g><rect x="650" y="160" width="470" height="205" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><circle cx="690" cy="202" r="19" fill="#5436ee"/><text x="684" y="209" font-family="Inter,system-ui,Arial,sans-serif" fill="white" font-size="20">2</text><text x="725" y="210" font-family="Inter,system-ui,Arial,sans-serif" font-size="26" font-weight="700" fill="#29232f">Access control</text><text x="680" y="332" font-family="Inter,system-ui,Arial,sans-serif" font-size="21" fill="#68606f">Viewer identity · query policy</text><path d="M695 235l32 12v27c0 22-32 36-32 36s-32-14-32-36V247Z" fill="#ded5fa"/><path d="m679 269 12 12 21-28" fill="none" stroke="#5436ee" stroke-width="4"/><g stroke="#8a73b4" stroke-width="3"><path d="M765 250h230m-230 22h150m-150 22h195"/></g><rect x="80" y="435" width="470" height="205" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><circle cx="120" cy="477" r="19" fill="#5436ee"/><text x="114" y="484" font-family="Inter,system-ui,Arial,sans-serif" fill="white" font-size="20">3</text><text x="155" y="485" font-family="Inter,system-ui,Arial,sans-serif" font-size="26" font-weight="700" fill="#29232f">Query evidence</text><text x="110" y="607" font-family="Inter,system-ui,Arial,sans-serif" font-size="21" fill="#68606f">Definition · filters · source</text><g fill="none" stroke="#8a73b4" stroke-width="3"><path d="m120 522-15 16 15 16m25-32 15 16-15 16M185 521h210m-210 22h170m-170 22h190"/></g><rect x="650" y="435" width="470" height="205" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><circle cx="690" cy="477" r="19" fill="#5436ee"/><text x="684" y="484" font-family="Inter,system-ui,Arial,sans-serif" fill="white" font-size="20">4</text><text x="725" y="485" font-family="Inter,system-ui,Arial,sans-serif" font-size="26" font-weight="700" fill="#29232f">Useful output</text><text x="680" y="607" font-family="Inter,system-ui,Arial,sans-serif" font-size="21" fill="#68606f">Chat · dashboard · HTML report</text><g fill="#c5b5f3"><rect x="680" y="550" width="35" height="28"/><rect x="728" y="530" width="35" height="48"/><rect x="776" y="510" width="35" height="68"/></g><g stroke="#8a73b4" stroke-width="3"><path d="M865 520h190m-190 22h165m-165 22h180"/></g><g fill="none" stroke="#5436ee" stroke-width="3" stroke-linecap="round"><path d="M565 264h66m-12-12 12 12-12 12M885 378v20H315v23m-12-12 12 12 12-12M565 535h66m-12-12 12 12-12 12"/></g><text x="80" y="705" font-family="Inter,system-ui,Arial,sans-serif" font-size="20" fill="#68606f">A reusable trial design — not a measured vendor benchmark.</text></svg>