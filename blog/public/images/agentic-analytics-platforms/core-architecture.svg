<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Core architecture of an agentic analytics platform</title><desc id="desc">A user question reaches an agent that consults shared business context, requests authorized queries over connected data, inspects returned results, and produces an answer with evidence. Users can review and clarify the answer.</desc><defs><style>text{font-family:Inter,system-ui,Arial,sans-serif}.title{font-weight:700;fill:#29232f}.sub{fill:#62586e}.line{fill:none;stroke:#6e50c7;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#9b8aaf;stroke-width:2.5;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#6e50c7" stroke-width="1.5"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#9b8aaf" stroke-width="1.5"/></marker></defs><rect width="1200" height="860" fill="#f5f4ef"/><text x="55" y="55" font-size="18" class="sub" text-anchor="start">AGENTIC ANALYTICS / CORE ARCHITECTURE</text><text x="55" y="108" font-size="34" class="title" text-anchor="start">From a business question to a reviewable answer</text><rect x="405" y="155" width="360" height="133" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="429" y="198" font-size="25" class="title" text-anchor="start">Shared business context</text><text x="429" y="237" font-size="23" class="sub" text-anchor="start">Definitions · relationships</text><text x="429" y="269" font-size="23" class="sub" text-anchor="start">Documents · reference SQL</text><rect x="55" y="350" width="245" height="173" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="79" y="393" font-size="25" class="title" text-anchor="start">User question</text><text x="79" y="432" font-size="23" class="sub" text-anchor="start">Why did net sales</text><text x="79" y="464" font-size="23" class="sub" text-anchor="start">fall last week?</text><rect x="405" y="335" width="360" height="205" rx="16" fill="#eee8fc" stroke="#8a6add" stroke-width="2"/><text x="429" y="378" font-size="25" class="title" text-anchor="start">Agent + analytical tools</text><text x="429" y="417" font-size="23" class="sub" text-anchor="start">Plan → request tools</text><text x="429" y="449" font-size="23" class="sub" text-anchor="start">Inspect results → follow up</text><text x="429" y="481" font-size="23" class="sub" text-anchor="start">Clarify when needed</text><rect x="885" y="350" width="260" height="173" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="909" y="393" font-size="25" class="title" text-anchor="start">Answer + evidence</text><text x="909" y="432" font-size="23" class="sub" text-anchor="start">Chat · dashboard</text><text x="909" y="464" font-size="23" class="sub" text-anchor="start">HTML report</text><rect x="405" y="665" width="360" height="147" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="429" y="708" font-size="25" class="title" text-anchor="start">Authorized execution</text><text x="429" y="747" font-size="23" class="sub" text-anchor="start">Queries / metric service</text><text x="429" y="779" font-size="23" class="sub" text-anchor="start">Viewer identity + policies</text><rect x="885" y="665" width="260" height="147" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="909" y="708" font-size="25" class="title" text-anchor="start">Connected data</text><text x="909" y="747" font-size="23" class="sub" text-anchor="start">Warehouses · files</text><text x="909" y="779" font-size="23" class="sub" text-anchor="start">Orders · refunds</text><path d="M300 430H393" class="line" marker-end="url(#arrow)"/><path d="M765 430H873" class="line" marker-end="url(#arrow)"/><path d="M555 335V288" class="line" marker-end="url(#arrow)"/><path d="M615 288V335" class="line" marker-end="url(#arrow)"/><path d="M525 540V653" class="line" marker-end="url(#arrow)"/><path d="M650 653V552" class="line" marker-end="url(#arrow)"/><path d="M765 710H873" class="line" marker-end="url(#arrow)"/><path d="M873 770H777" class="line" marker-end="url(#arrow)"/><text x="425" y="593" font-size="20" class="sub" text-anchor="start">Requests</text><text x="662" y="593" font-size="20" class="sub" text-anchor="start">Results</text><path d="M1015 535V615H177V535" class="feedback" marker-end="url(#muted)"/><text x="70" y="606" font-size="21" class="sub" text-anchor="start">Human review / clarification</text></svg>