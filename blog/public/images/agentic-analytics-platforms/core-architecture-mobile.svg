<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1270" viewBox="0 0 640 1270" role="img" aria-labelledby="title desc"><title id="title">Core architecture of an agentic analytics platform</title><desc id="desc">A user question reaches an agent that consults shared business context, requests authorized queries over connected data, inspects returned results, and produces an answer with evidence. Users can review and clarify the answer.</desc><defs><style>text{font-family:Inter,system-ui,Arial,sans-serif}.title{font-weight:700;fill:#29232f}.sub{fill:#62586e}.line{fill:none;stroke:#6e50c7;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#9b8aaf;stroke-width:2.5;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#6e50c7" stroke-width="1.5"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#9b8aaf" stroke-width="1.5"/></marker></defs><rect width="640" height="1270" fill="#f5f4ef"/><text x="35" y="50" font-size="22" class="sub" text-anchor="start">AGENTIC ANALYTICS</text><text x="35" y="95" font-size="31" class="title" text-anchor="start">How the components connect</text><rect x="35" y="140" width="270" height="180" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="59" y="183" font-size="29" class="title" text-anchor="start">User question</text><text x="59" y="222" font-size="27" class="sub" text-anchor="start">Why did net</text><text x="59" y="254" font-size="27" class="sub" text-anchor="start">sales fall?</text><rect x="335" y="140" width="270" height="180" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="359" y="183" font-size="28" class="title" text-anchor="start">Business context</text><text x="359" y="222" font-size="26" class="sub" text-anchor="start">Definitions</text><text x="359" y="254" font-size="26" class="sub" text-anchor="start">Relationships</text><rect x="90" y="400" width="460" height="185" rx="16" fill="#eee8fc" stroke="#8a6add" stroke-width="2"/><text x="114" y="443" font-size="29" class="title" text-anchor="start">Agent + analytical tools</text><text x="114" y="482" font-size="27" class="sub" text-anchor="start">Plan → query → inspect</text><text x="114" y="514" font-size="27" class="sub" text-anchor="start">Ask follow-up questions</text><rect x="90" y="680" width="460" height="170" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="114" y="723" font-size="29" class="title" text-anchor="start">Authorized execution</text><text x="114" y="762" font-size="27" class="sub" text-anchor="start">Queries / metric service</text><text x="114" y="794" font-size="27" class="sub" text-anchor="start">Viewer identity + policies</text><rect x="35" y="945" width="270" height="178" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="59" y="988" font-size="28" class="title" text-anchor="start">Connected data</text><text x="59" y="1027" font-size="26" class="sub" text-anchor="start">Warehouses</text><text x="59" y="1059" font-size="26" class="sub" text-anchor="start">Orders · refunds</text><rect x="335" y="945" width="270" height="178" rx="16" fill="white" stroke="#d6cddf" stroke-width="2"/><text x="359" y="988" font-size="26" class="title" text-anchor="start">Answer + evidence</text><text x="359" y="1027" font-size="24" class="sub" text-anchor="start">Chat · dashboard</text><text x="359" y="1059" font-size="24" class="sub" text-anchor="start">HTML report</text><path d="M170 320V355H215V388" class="line" marker-end="url(#arrow)"/><path d="M470 320V355H425V388" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M240 585V668" class="line" marker-end="url(#arrow)"/><path d="M395 668V597" class="line" marker-end="url(#arrow)"/><text x="132" y="636" font-size="23" class="sub" text-anchor="start">Requests</text><text x="410" y="636" font-size="23" class="sub" text-anchor="start">Results</text><path d="M215 850V890H170V933" class="line" marker-end="url(#arrow)"/><path d="M290 933V903H278V862" class="line" marker-end="url(#arrow)"/><path d="M550 488H622V905H470V933" class="line" marker-end="url(#arrow)"/><path d="M470 1135V1200H17V230H23" class="feedback" marker-end="url(#muted)"/><text x="92" y="1235" font-size="25" class="sub" text-anchor="start">Review results and clarify the question</text></svg>