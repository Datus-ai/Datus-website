<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="t d"><title id="t">Finance, a store manager and an AI agent use the same net revenue definition</title><desc id="d">In the fictional example, completed-order sales of 250 minus refunds of 20 give net revenue of 230. Cancelled orders do not count. Each consumer uses the same metric, reporting scope and authorized data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9475c9"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#272e25"><text x="38" y="49" font-size="28" font-weight="700">One business question. One shared definition.</text><rect x="38" y="90" width="324" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(56 105)" fill="none" stroke="#7651b5" stroke-width="2.5"><circle cx="28" cy="18" r="12"/><path d="M7 59v-9c0-22 42-22 42 0v9"/><path d="M22 37l6 9 6-9M28 46v12"/></g><text x="126" y="135" font-size="22" font-weight="700">Finance</text><text x="58" y="202" font-size="18">“What is net revenue?”</text><text x="58" y="229" font-size="15" fill="#686b62">Financial report</text><path d="M200 245V277H560V302" fill="none" stroke="#b19bcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="398" y="90" width="324" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(416 105)" fill="none" stroke="#7651b5" stroke-width="2.5"><circle cx="28" cy="18" r="12"/><path d="M7 59v-9c0-22 42-22 42 0v9"/><path d="M10 48h36M20 39v20M36 39v20"/></g><text x="486" y="135" font-size="22" font-weight="700">Store manager</text><text x="418" y="202" font-size="18">“Show net revenue.”</text><text x="418" y="229" font-size="15" fill="#686b62">Store dashboard</text><path d="M560 245V277H560V302" fill="none" stroke="#b19bcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="758" y="90" width="324" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(776 105)" fill="none" stroke="#7651b5" stroke-width="2.5"><rect x="7" y="17" width="43" height="33" rx="8"/><circle cx="20" cy="31" r="2.8" fill="#7651b5"/><circle cx="37" cy="31" r="2.8" fill="#7651b5"/><path d="M20 42H37M29 17V8M1 27V40M56 27V40"/><circle cx="29" cy="5" r="3"/></g><text x="846" y="135" font-size="22" font-weight="700">AI agent</text><text x="778" y="202" font-size="18">“Which revenue definition?”</text><text x="778" y="229" font-size="15" fill="#686b62">Conversational answer</text><path d="M920 245V277H560V302" fill="none" stroke="#b19bcf" stroke-width="2" marker-end="url(#arrow)"/><rect x="135" y="313" width="850" height="231" rx="15" fill="#eee7fa"/><text x="168" y="352" font-size="19" fill="#7256a3">SHARED SEMANTIC DEFINITION</text><text x="168" y="394" font-size="30" font-weight="700">Net revenue</text><text x="168" y="435" font-size="21">Completed-order sales − refunds</text><text x="168" y="474" font-size="18">Cancelled orders excluded · USD · completion date</text><line x1="731" y1="352" x2="731" y2="504" stroke="#cab8e5"/><text x="771" y="411" font-size="48" font-weight="700" fill="#6e4baf">$230</text><text x="771" y="451" font-size="19">$250 − $20</text><text x="168" y="517" font-size="16" fill="#64665f">Same metric, period and authorized scope for every consumer.</text><text x="38" y="600" font-size="17" fill="#62685f">Fictional example · The definition makes the rule visible instead of leaving each tool to guess.</text></g></svg>