<svg xmlns="http://www.w3.org/2000/svg" width="420" height="970" viewBox="0 0 420 970" role="img" aria-labelledby="t"><title id="t">Source records, semantic definitions and consumers of the fictional revenue metric</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#876ac1"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292e26"><text x="22" y="39" font-size="23" font-weight="700">One definition, shared answers</text><rect x="22" y="75" width="376" height="210" rx="9" fill="white" stroke="#c9bddf"/><text x="42" y="109" font-size="21" font-weight="700">Source records</text><text x="42" y="147" font-size="17">One row per order</text><text x="42" y="176" font-size="17">Gross amount and refunds</text><text x="42" y="205" font-size="17">Status, region and date</text><rect x="22" y="325" width="376" height="240" rx="9" fill="white" stroke="#c9bddf"/><text x="42" y="359" font-size="21" font-weight="700">Semantic definition</text><text x="42" y="397" font-size="17">net_revenue</text><text x="42" y="426" font-size="17">Completed orders only</text><text x="42" y="455" font-size="17">Gross minus refunds</text><text x="42" y="484" font-size="17">Group by region</text><rect x="22" y="605" width="376" height="210" rx="9" fill="white" stroke="#c9bddf"/><text x="42" y="639" font-size="21" font-weight="700">Consumers</text><text x="42" y="677" font-size="17">Dashboard · Report · Agent</text><text x="42" y="706" font-size="17">Same metric and scope</text><text x="42" y="735" font-size="17">West 100 · East 130</text><path d="M210 285v30M210 565v30" stroke="#876ac1" stroke-width="2.5" marker-end="url(#a)"/><text x="22" y="866" font-size="18" font-weight="700">Check the execution context</text><text x="22" y="900" font-size="17">Dates · Identity · Source quality</text><text x="22" y="929" font-size="17">Inspect the query and result</text></g></svg>