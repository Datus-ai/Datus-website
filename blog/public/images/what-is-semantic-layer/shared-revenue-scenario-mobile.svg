<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1025" viewBox="0 0 420 1025" role="img" aria-labelledby="t d"><title id="t">Finance, a store manager and an AI agent use the same net revenue definition</title><desc id="d">In the fictional example, completed-order sales of 250 minus refunds of 20 give net revenue of 230. Cancelled orders do not count. Each consumer uses the same metric, reporting scope and authorized data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9475c9"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#272e25"><text x="22" y="40" font-size="23" font-weight="700">One shared revenue definition</text><rect x="22" y="70" width="376" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(40 85)" fill="none" stroke="#7651b5" stroke-width="2.5"><circle cx="28" cy="18" r="12"/><path d="M7 59v-9c0-22 42-22 42 0v9"/><path d="M22 37l6 9 6-9M28 46v12"/></g><text x="110" y="115" font-size="22" font-weight="700">Finance</text><text x="42" y="182" font-size="18">“What is net revenue?”</text><text x="42" y="209" font-size="15" fill="#686b62">Financial report</text><rect x="22" y="245" width="376" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(40 260)" fill="none" stroke="#7651b5" stroke-width="2.5"><circle cx="28" cy="18" r="12"/><path d="M7 59v-9c0-22 42-22 42 0v9"/><path d="M10 48h36M20 39v20M36 39v20"/></g><text x="110" y="290" font-size="22" font-weight="700">Store manager</text><text x="42" y="357" font-size="18">“Show net revenue.”</text><text x="42" y="384" font-size="15" fill="#686b62">Store dashboard</text><rect x="22" y="420" width="376" height="155" rx="11" fill="white" stroke="#d6cbe5"/><g transform="translate(40 435)" fill="none" stroke="#7651b5" stroke-width="2.5"><rect x="7" y="17" width="43" height="33" rx="8"/><circle cx="20" cy="31" r="2.8" fill="#7651b5"/><circle cx="37" cy="31" r="2.8" fill="#7651b5"/><path d="M20 42H37M29 17V8M1 27V40M56 27V40"/><circle cx="29" cy="5" r="3"/></g><text x="110" y="465" font-size="22" font-weight="700">AI agent</text><text x="42" y="532" font-size="18">“Which revenue definition?”</text><text x="42" y="559" font-size="15" fill="#686b62">Conversational answer</text><path d="M210 575v35" fill="none" stroke="#9475c9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="22" y="625" width="376" height="290" rx="12" fill="#eee7fa"/><text x="42" y="666" font-size="23" font-weight="700">Net revenue</text><text x="42" y="705" font-size="19">Completed sales − refunds</text><text x="42" y="739" font-size="17">Cancelled orders excluded</text><text x="42" y="770" font-size="17">USD · order completion date</text><text x="42" y="825" font-size="39" font-weight="700" fill="#6e4baf">$250 − $20 = $230</text><text x="42" y="866" font-size="16">Same metric, period</text><text x="42" y="891" font-size="16">and authorized scope.</text><text x="22" y="966" font-size="17" fill="#63695e">Fictional example · Reviewed rules</text><text x="22" y="993" font-size="17" fill="#63695e">replace separate guesses.</text></g></svg>