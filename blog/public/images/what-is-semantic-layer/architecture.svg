<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="t"><title id="t">Semantic layer architecture using the fictional net revenue example</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#876ac1"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292e26"><text x="35" y="46" font-size="27" font-weight="700">From source records to shared business answers</text><rect x="35" y="110" width="260" height="240" rx="9" fill="white" stroke="#c9bddf"/><text x="55" y="144" font-size="21" font-weight="700">Source records</text><text x="55" y="182" font-size="17">One row per order</text><text x="55" y="211" font-size="17">Gross amount and refunds</text><text x="55" y="240" font-size="17">Completed / cancelled</text><text x="55" y="269" font-size="17">Region and completion date</text><rect x="355" y="110" width="295" height="240" rx="9" fill="white" stroke="#c9bddf"/><text x="375" y="144" font-size="21" font-weight="700">Semantic definition</text><text x="375" y="182" font-size="17">net_revenue</text><text x="375" y="211" font-size="17">Completed orders only</text><text x="375" y="240" font-size="17">Gross minus refunds</text><text x="375" y="269" font-size="17">Group by region</text><rect x="710" y="110" width="255" height="240" rx="9" fill="white" stroke="#c9bddf"/><text x="730" y="144" font-size="21" font-weight="700">Consumers</text><text x="730" y="182" font-size="17">Dashboard · Report</text><text x="730" y="211" font-size="17">AI Agent · Application</text><text x="730" y="240" font-size="17">Same metric and scope</text><text x="730" y="269" font-size="17">West 100 · East 130</text><path d="M295 230H345M650 230H700" stroke="#876ac1" fill="none" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="390" width="930" height="115" rx="9" fill="#eee8fa"/><text x="55" y="425" font-size="20" font-weight="700">Execution context stays explicit</text><text x="55" y="459" font-size="18">Requested dates · Authorized identity · Source quality · Query and result checks</text></g></svg>