<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">How Datus controls access to a live HTML dashboard</title>
<desc id="desc">IT defines access policies centrally. A viewer signs in. Datus applies the viewer's row filters and column masking to supported live queries. The HTML dashboard displays only the permitted result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#7753bc"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#252b24}.title{font-size:34px;font-weight:600}.head{font-size:26px;font-weight:600}.body{font-size:23px;fill:#56614f}.small{font-size:21px;fill:#56614f}.line{fill:none;stroke:#7753bc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="660" rx="20" fill="#f3f3ed"/>
<text x="60" y="66" class="title">Flexible dashboards. Centrally managed access.</text>
<rect x="400" y="110" width="400" height="100" rx="14" fill="#e9e1f4"/>
<text x="600" y="150" text-anchor="middle" class="head">IT sets the access rules</text>
<text x="600" y="185" text-anchor="middle" class="body">Who sees which rows and columns</text>
<path d="M600 215V265" class="line" marker-end="url(#arrow)"/>
<rect x="50" y="280" width="310" height="280" rx="16" fill="#fff"/>
<rect x="435" y="280" width="330" height="280" rx="16" fill="#e9e1f4"/>
<rect x="840" y="280" width="310" height="280" rx="16" fill="#fff"/>
<g class="line"><circle cx="205" cy="335" r="19"/><path d="M170 390v-9a35 35 0 0 1 70 0v9"/>
<path d="M600 312l36 13v28c0 28-36 48-36 48s-36-20-36-48v-28z"/><path d="M583 351l12 12 22-25"/>
<rect x="955" y="318" width="80" height="68" rx="6"/><path d="M955 334h80M972 372v-15m23 15v-26m23 26v-19"/></g>
<text x="205" y="441" text-anchor="middle" class="head">Viewer signs in</text>
<text x="205" y="482" text-anchor="middle" class="body">Opens the dashboard</text>
<text x="205" y="516" text-anchor="middle" class="body">in Studio or an iframe</text>
<text x="600" y="441" text-anchor="middle" class="head">Datus checks access</text>
<text x="600" y="482" text-anchor="middle" class="body">Filters rows and masks</text>
<text x="600" y="516" text-anchor="middle" class="body">columns for this viewer</text>
<text x="995" y="441" text-anchor="middle" class="head">HTML shows the result</text>
<text x="995" y="482" text-anchor="middle" class="body">Only permitted data</text>
<text x="995" y="516" text-anchor="middle" class="body">reaches the interface</text>
<path d="M368 420H423M773 420H828" class="line" marker-end="url(#arrow)"/>
<text x="600" y="613" text-anchor="middle" class="small">Live queries use the viewer's identity and IT-managed policies.</text>
</svg>