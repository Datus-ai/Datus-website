<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc"><title id="title">Inside an orders-and-customers semantic model</title><desc id="desc">Orders connect to customers through customer_id. The model defines completed_revenue and exposes customer region as a dimension. The fictional sample returns East 250 and West 80.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8b70be"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292e26"><text x="35" y="47" font-size="29" font-weight="700">What the semantic model actually defines</text><rect x="25" y="80" width="1050" height="480" rx="14" fill="#f2eff8"/><text x="45" y="112" font-size="17" fill="#7353a2">ONE MODEL · TWO RELATED DATASETS</text><rect x="55" y="145" width="300" height="177" rx="9" fill="white" stroke="#d0c2e5"/><text x="75" y="180" font-size="22" font-weight="700">orders</text><text x="75" y="218" font-size="18">order_id · customer_id</text><text x="75" y="248" font-size="18">amount · status</text><text x="75" y="278" font-size="18">order_date</text><rect x="55" y="380" width="300" height="135" rx="9" fill="white" stroke="#d0c2e5"/><text x="75" y="415" font-size="22" font-weight="700">customers</text><text x="75" y="453" font-size="18">customer_id · region</text><path d="M205 322v48" fill="none" stroke="#8b70be" stroke-width="2" marker-end="url(#arrow)"/><text x="222" y="353" font-size="16" fill="#725790">customer_id</text><rect x="415" y="145" width="605" height="177" rx="9" fill="white" stroke="#d0c2e5"/><text x="435" y="180" font-size="22" font-weight="700">Metric: completed_revenue</text><text x="435" y="218" font-size="18">Sum order amounts</text><text x="435" y="248" font-size="18">Include completed orders only</text><text x="435" y="278" font-size="18">Explicit population and aggregation</text><rect x="415" y="380" width="605" height="135" rx="9" fill="white" stroke="#d0c2e5"/><text x="435" y="415" font-size="22" font-weight="700">Dimension: customers.region</text><text x="435" y="453" font-size="18">Group the metric through the customer relationship</text><path d="M355 227h49M355 447h49" fill="none" stroke="#8b70be" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 560v29" fill="none" stroke="#8b70be" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="625" font-size="21" font-weight="700">Request: completed revenue by customer region</text><text x="35" y="668" font-size="23" fill="#6e4aa6">Fictional example: East 250 · West 80 · Total 330</text></g></svg>