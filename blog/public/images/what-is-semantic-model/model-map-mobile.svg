<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1135" viewBox="0 0 420 1135" role="img" aria-labelledby="title desc"><title id="title">Inside an orders-and-customers semantic model</title><desc id="desc">Orders connect to customers through customer_id. The model defines completed_revenue and exposes customer region as a dimension. The fictional sample returns East 250 and West 80.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8b70be"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#faf9f6"/><g font-family="Inter,Arial,sans-serif" fill="#292e26"><text x="22" y="40" font-size="24" font-weight="700">Inside the semantic model</text><text x="22" y="74" font-size="17" fill="#7353a2">Two datasets · one business question</text><rect x="22" y="100" width="376" height="175" rx="9" fill="white" stroke="#d0c2e5"/><text x="42" y="135" font-size="22" font-weight="700">orders</text><text x="42" y="173" font-size="18">order_id · customer_id</text><text x="42" y="203" font-size="18">amount · status</text><text x="42" y="233" font-size="18">order_date</text><path d="M210 275v41" fill="none" stroke="#8b70be" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="303" font-size="16">customer_id</text><rect x="22" y="330" width="376" height="130" rx="9" fill="white" stroke="#d0c2e5"/><text x="42" y="365" font-size="22" font-weight="700">customers</text><text x="42" y="403" font-size="18">customer_id · region</text><rect x="22" y="505" width="376" height="205" rx="9" fill="#eee6fb" stroke="#d0c2e5"/><text x="42" y="540" font-size="22" font-weight="700">Metric</text><text x="42" y="578" font-size="18">completed_revenue</text><text x="42" y="608" font-size="18">Sum completed-order amounts</text><text x="42" y="638" font-size="18">Population + aggregation</text><rect x="22" y="750" width="376" height="130" rx="9" fill="#eee6fb" stroke="#d0c2e5"/><text x="42" y="785" font-size="22" font-weight="700">Dimension</text><text x="42" y="823" font-size="18">customers.region</text><text x="22" y="933" font-size="21" font-weight="700">Completed revenue by region</text><text x="22" y="979" font-size="24" fill="#6e4aa6">East 250 · West 80</text><text x="22" y="1021" font-size="24" fill="#6e4aa6">Total 330</text><text x="22" y="1083" font-size="17" fill="#666a60">Fictional data from the linked example.</text></g></svg>