version: 0.2.0.dev0
name: northstar_blog_mapping
ontology_ref:
  name: NorthstarBusinessOntology
  iri: ./northstar.ontology.yaml
semantic_model_ref:
  name: northstar_complete
  iri: ./model.yaml
concept_mappings:
- concept: Customer
  object_mappings:
  - &id001
    referent_mappings:
    - relationship: id
      expression: customers.customer_id
  link_mappings:
  - object_mapping: *id001
    children:
    - relationship: name
      object_mapping:
        concept: String
        expression: customers.full_name
    - relationship: email
      object_mapping:
        concept: String
        expression: customers.email
    - relationship: city
      object_mapping:
        concept: String
        expression: customers.city
    - relationship: margin
      object_mapping:
        concept: Decimal
        expression: customers.customer_margin
    - relationship: order_count
      object_mapping:
        concept: Integer
        expression: customers.customer_orders
    - relationship: return_rate
      object_mapping:
        concept: Decimal
        expression: customers.customer_return_rate
  - relationship: premier
    object_mapping:
      referent_mappings:
      - relationship: id
        expression: customers.customer_id WHERE ( COALESCE((CASE WHEN customers.fixed_order_count>0
          THEN COALESCE(customers.fixed_booked_revenue,0)-COALESCE(customers.fixed_refund_amount,0)-COALESCE(customers.fixed_product_cost,0)+COALESCE(customers.fixed_recovered_product_cost,0)-COALESCE(customers.fixed_outbound_shipping,0)-COALESCE(customers.fixed_payment_fees,0)-COALESCE(customers.fixed_return_handling,0)
          END)>=3000 AND customers.fixed_order_count>=6 AND (COALESCE(customers.fixed_returned_order_count,0)*1.0/NULLIF(customers.fixed_order_count,0))<=0.20,FALSE)
          )
  - relationship: premier_b
    object_mapping:
      referent_mappings:
      - relationship: id
        expression: customers.customer_id WHERE ( COALESCE((CASE WHEN customers.fixed_order_count>0
          THEN COALESCE(customers.fixed_booked_revenue,0)-COALESCE(customers.fixed_refund_amount,0)-COALESCE(customers.fixed_product_cost,0)+COALESCE(customers.fixed_recovered_product_cost,0)-COALESCE(customers.fixed_outbound_shipping,0)-COALESCE(customers.fixed_payment_fees,0)-COALESCE(customers.fixed_return_handling,0)
          END)>=4000 AND customers.fixed_order_count>=6 AND (COALESCE(customers.fixed_returned_order_count,0)*1.0/NULLIF(customers.fixed_order_count,0))<=0.20,FALSE)
          )
- concept: Order
  object_mappings:
  - &id002
    referent_mappings:
    - relationship: id
      expression: orders.order_id
  link_mappings:
  - object_mapping: *id002
    children:
    - relationship: delivered_at
      object_mapping:
        concept: Date
        expression: orders.delivered_at
    - relationship: amount_cents
      object_mapping:
        concept: Integer
        expression: orders.order_amount_cents
    - relationship: is_returned
      object_mapping:
        concept: Boolean
        expression: orders.is_returned
    - relationship: placed_by
      object_mapping:
        concept: Customer
        referent_mappings:
        - relationship: id
          expression: orders.customer_id
