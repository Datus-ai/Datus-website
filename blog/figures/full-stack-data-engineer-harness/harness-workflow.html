<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_figure.css" />
<style>
  #figure { padding: 24px 20px 20px; }
  svg { display: block; font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
  .t      { font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  .t-sm   { font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  .lbl    { font-size: 10.5px; font-weight: 500; fill: #64748b; text-anchor: middle; }
  .lbl-l  { font-size: 10.5px; font-weight: 600; fill: #16a34a; text-anchor: start; }
  .lbl-r  { font-size: 10.5px; font-weight: 600; fill: #dc2626; text-anchor: middle; }
  .grp    { font-size: 12px; font-weight: 700; fill: #2151a8; }
  .ttl    { font-size: 21px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
  .flow   { stroke: #334155; stroke-width: 1.6; fill: none; }
  .flow-b { stroke: #334155; stroke-width: 2.4; fill: none; }
  .dash   { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  .fail   { stroke: #dc2626; stroke-width: 1.5; fill: none; }
  .pass   { stroke: #16a34a; stroke-width: 1.7; fill: none; }
</style>
</head>
<body>
<div id="figure">
<svg width="1040" height="636" viewBox="0 0 1040 636" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1l8 4-8 4z" fill="#334155"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1l8 4-8 4z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1l8 4-8 4z" fill="#94a3b8"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1l8 4-8 4z" fill="#dc2626"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1l8 4-8 4z" fill="#16a34a"/></marker>
  </defs>

  <text class="ttl" x="520" y="26">Harness Workflow</text>

  <!-- legend -->
  <g>
    <rect x="22" y="42" width="92" height="26" rx="6" fill="#cfe2fb" stroke="#93bdf1" stroke-width="1.2"/>
    <text class="t-sm" x="68" y="56" fill="#1d4c9e">Human</text>
    <rect x="124" y="42" width="108" height="26" rx="6" fill="#fbe3bd" stroke="#eec483" stroke-width="1.2"/>
    <text class="t-sm" x="178" y="56" fill="#8a5c07">Orchestrator</text>
    <rect x="22" y="78" width="92" height="26" rx="6" fill="#cdefda" stroke="#86cfa4" stroke-width="1.2"/>
    <text class="t-sm" x="68" y="92" fill="#15693f">Executor</text>
    <rect x="124" y="78" width="108" height="26" rx="6" fill="#e0d9fb" stroke="#bcadf1" stroke-width="1.2"/>
    <text class="t-sm" x="178" y="92" fill="#5233b8">Program</text>
  </g>

  <!-- person -->
  <g fill="#5b8def">
    <circle cx="44" cy="292" r="9"/>
    <path d="M31 308a13 13 0 0 1 26 0v14a4 4 0 0 1-4 4H35a4 4 0 0 1-4-4z"/>
  </g>

  <!-- main chain -->
  <rect x="78" y="288" width="108" height="48" rx="9" fill="#cfe2fb" stroke="#93bdf1" stroke-width="1.3"/>
  <text class="t" x="132" y="313" fill="#1d4c9e">Create Goal</text>

  <rect x="206" y="288" width="96" height="48" rx="9" fill="#fbe3bd" stroke="#eec483" stroke-width="1.3"/>
  <text class="t" x="254" y="313" fill="#8a5c07">Decompose</text>

  <rect x="322" y="282" width="122" height="60" rx="9" fill="#cfe2fb" stroke="#93bdf1" stroke-width="1.3"/>
  <text class="t" x="383" y="303" fill="#1d4c9e">Confirm</text>
  <text class="t" x="383" y="321" fill="#1d4c9e">Decompose Plan</text>

  <path class="flow" d="M62 312h12" marker-end="url(#a)"/>
  <path class="flow" d="M186 312h14" marker-end="url(#a)"/>
  <path class="flow" d="M302 312h14" marker-end="url(#a)"/>

  <!-- auto-approve -->
  <path class="dash" d="M254 288v-36h156v24" marker-end="url(#ad)"/>
  <text class="lbl" x="334" y="246">auto-approve</text>

  <!-- replan -->
  <path class="flow" d="M383 342v30H254v-30" marker-end="url(#a)"/>
  <text class="lbl" x="330" y="368" style="fill:#334155">Replan</text>

  <!-- split into lanes -->
  <path class="flow-b" d="M444 312h32"/>
  <path class="flow-b" d="M476 179v192"/>
  <path class="flow-b" d="M476 179h18" marker-end="url(#a)"/>
  <path class="flow-b" d="M476 275h18" marker-end="url(#a)"/>
  <path class="flow-b" d="M476 371h18" marker-end="url(#a)"/>

  <!-- validation loop container -->
  <rect x="490" y="100" width="490" height="330" rx="14" fill="#f2f7fe" stroke="#d6e4f8" stroke-width="1.3"/>
  <text class="grp" x="506" y="124">Validation Loop</text>

  <!-- lane 1 -->
  <rect x="504" y="140" width="458" height="78" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.3"/>
  <rect x="518" y="162" width="80" height="34" rx="8" fill="#cdefda" stroke="#86cfa4" stroke-width="1.3"/>
  <text class="t" x="558" y="180" fill="#15693f">Task_1</text>
  <rect x="612" y="162" width="110" height="34" rx="8" fill="#e0d9fb" stroke="#bcadf1" stroke-width="1.3"/>
  <text class="t-sm" x="667" y="180" fill="#5233b8">Validation_script</text>
  <rect x="736" y="162" width="108" height="34" rx="8" fill="#e0d9fb" stroke="#bcadf1" stroke-width="1.3"/>
  <text class="t-sm" x="790" y="180" fill="#5233b8">git worktree diff</text>
  <rect x="860" y="162" width="86" height="34" rx="8" fill="#fbe3bd" stroke="#eec483" stroke-width="1.3"/>
  <text class="t" x="903" y="180" fill="#8a5c07">Review</text>
  <path class="flow" d="M598 179h8" marker-end="url(#ab)"/>
  <path class="flow" d="M722 179h8" marker-end="url(#ab)"/>
  <path class="flow" d="M844 179h8" marker-end="url(#ab)"/>
  <path class="fail" d="M903 162v-16H558v12" marker-end="url(#af)"/>
  <text class="lbl-r" x="740" y="142">Failed</text>

  <!-- lane 2 -->
  <rect x="504" y="236" width="458" height="78" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.3"/>
  <rect x="518" y="258" width="80" height="34" rx="8" fill="#cdefda" stroke="#86cfa4" stroke-width="1.3"/>
  <text class="t" x="558" y="276" fill="#15693f">Task_2</text>
  <path class="dash" d="M598 275h130" marker-end="url(#ad)"/>
  <text class="lbl" x="663" y="266">--no-validate</text>
  <text class="lbl" x="663" y="292">or “non-validate task”</text>
  <rect x="736" y="258" width="108" height="34" rx="8" fill="#e0d9fb" stroke="#bcadf1" stroke-width="1.3"/>
  <text class="t-sm" x="790" y="276" fill="#5233b8">git worktree diff</text>
  <rect x="860" y="258" width="86" height="34" rx="8" fill="#fbe3bd" stroke="#eec483" stroke-width="1.3"/>
  <text class="t" x="903" y="276" fill="#8a5c07">Review</text>
  <path class="flow" d="M844 275h8" marker-end="url(#ab)"/>
  <path class="fail" d="M903 258v-16H558v12" marker-end="url(#af)"/>
  <text class="lbl-r" x="740" y="238">Failed</text>

  <!-- lane 3 -->
  <rect x="504" y="332" width="458" height="78" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.3"/>
  <rect x="518" y="354" width="80" height="34" rx="8" fill="#cdefda" stroke="#86cfa4" stroke-width="1.3"/>
  <text class="t" x="558" y="372" fill="#15693f">Task_3</text>
  <path class="dash" d="M598 371h344" marker-end="url(#ad)"/>
  <text class="lbl" x="806" y="362">--no-review</text>

  <!-- pass rail -->
  <path class="pass" d="M962 179h38"/>
  <path class="pass" d="M962 275h38"/>
  <path class="pass" d="M962 371h38"/>
  <path class="pass" d="M1000 179v368"/>
  <text class="lbl-l" x="1006" y="200">Pass</text>
  <text class="lbl-l" x="1006" y="296">Pass</text>
  <text class="lbl-l" x="1006" y="392">Pass</text>

  <!-- bottom row -->
  <rect x="398" y="522" width="116" height="50" rx="9" fill="#fbe3bd" stroke="#eec483" stroke-width="1.3"/>
  <text class="t" x="456" y="541" fill="#8a5c07">update-docs</text>
  <text class="t-sm" x="456" y="558" fill="#8a5c07">(agent.md)</text>

  <rect x="262" y="522" width="104" height="50" rx="9" fill="#cfe2fb" stroke="#93bdf1" stroke-width="1.3"/>
  <text class="t" x="314" y="541" fill="#1d4c9e">Confirm</text>
  <text class="t" x="314" y="558" fill="#1d4c9e">Commit</text>

  <rect x="128" y="522" width="96" height="50" rx="9" fill="#fbe3bd" stroke="#eec483" stroke-width="1.3"/>
  <text class="t" x="176" y="547" fill="#8a5c07">commit</text>

  <path class="pass" d="M1000 547H524" marker-end="url(#ap)"/>
  <path class="flow" d="M398 547h-22" marker-end="url(#a)"/>
  <path class="flow" d="M262 547h-28" marker-end="url(#a)"/>
  <path class="flow" d="M128 547H44V340" marker-end="url(#a)"/>

  <!-- auto commit -->
  <path class="dash" d="M456 572v28H176v-22" marker-end="url(#ad)"/>
  <text class="lbl" x="316" y="596">Auto commit</text>
</svg>
</div>
</body>
</html>
