<style>
  #figure { width: 820px; }

<body>
<div id="figure">
  <h1>Metrics and entities are different semantic types — expose both</h1>

  <div class="centered"><div class="node">User question</div></div>
  <div class="arrow-v"><svg width="16" height="44" viewBox="0 0 16 44" fill="none"><path d="M8 0v33" stroke="currentColor" stroke-width="2.2"/><path d="M2.5 32 8 42l5.5-10z" fill="currentColor"/></svg></div>
  <div class="centered"><div class="node">Agent</div></div>

  <svg width="740" height="52" viewBox="0 0 740 52" fill="none" style="color:#334155">
    <path d="M370 0v18M175 18h390M175 18v16M565 18v16" stroke="currentColor" stroke-width="2.2"/>
    <path d="M169.5 33 175 42l5.5-9zM559.5 33 565 42l5.5-9z" fill="currentColor"/>
  </svg>

  <div class="cols">
    <div class="node">Metric plane<small><code>query_metrics</code></small></div>
    <div class="node">Entity plane<small><code>query_objects</code> / <code>select</code></small></div>
  </div>

  <svg width="740" height="52" viewBox="0 0 740 52" fill="none" style="color:#334155">
    <path d="M175 0v18M565 0v18M175 18h390M370 18v16" stroke="currentColor" stroke-width="2.2"/>

  </svg>

  <div class="centered"><div class="node">Dosi planner</div></div>
  <div class="arrow-v"><svg width="16" height="44" viewBox="0 0 16 44" fill="none"><path d="M8 0v33" stroke="currentColor" stroke-width="2.2"/><path d="M2.5 32 8 42l5.5-10z" fill="currentColor"/></svg></div>
  <div class="centered"><div class="node">Generated SQL</div></div>

  <p class="caption">The ontology is the bridge: it tells the agent which plane to use, and how to move between them.</p>
</div>
